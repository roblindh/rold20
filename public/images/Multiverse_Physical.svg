<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" width="100%" height="100%" style="background:#faf8f5; font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Shadows & Glows -->
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Core Gradients -->
    <radialGradient id="matGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
    <radialGradient id="ethGrad" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#fdf4ff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Polar Gradients -->
    <radialGradient id="posGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="negGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="40%" stop-color="#3b0764"/>
      <stop offset="80%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Elemental Gradients -->
    <linearGradient id="airGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Para-Elemental Gradients -->
    <linearGradient id="smokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="magmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="goldArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7e22ce"/>
    </marker>
  </defs>

  <!-- Frame Background -->
  <rect x="12" y="12" width="916" height="626" rx="10" fill="#faf8f5" stroke="#e2d8c3" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Outer Header -->
  <text x="36" y="44" font-family="Georgia, Cambria, serif" font-size="20" font-weight="bold" fill="#78350f">The Physical &amp; Elemental Cosmology</text>
  <text x="36" y="64" font-size="11.5" fill="#64748b">Spherical Celestial Topology: Positive/Negative Poles, the Elemental Equator &amp; the Ethereal Nexus</text>

  <!-- ========================================================================= -->
  <!-- LEFT PANEL: 3D SPHERICAL TOPOLOGY (Center: 240, 290)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(240, 280)">
    
    <!-- Panel Label -->
    <text x="0" y="-188" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f" letter-spacing="0.5">3D Physical Celestial Sphere</text>
    <text x="0" y="-174" text-anchor="middle" font-size="8.5" fill="#64748b">Spherical envelope surrounding the Material Universe</text>

    <!-- Outer Sphere Silhouette & Longitudinal Meridian Arcs -->
    <circle cx="0" cy="0" r="145" fill="#f8fafc" fill-opacity="0.6" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="65" ry="145" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
    <ellipse cx="0" cy="0" rx="110" ry="145" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="0" y1="-145" x2="0" y2="145" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="3 3"/>

    <!-- Polar Flow Field Lines (North Pole to South Pole) -->
    <path d="M 0 -130 C -180 -80, -180 80, 0 130" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 0 -130 C 180 -80, 180 80, 0 130" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Equatorial Belt Ellipse (Tilted 3D perspective) -->
    <ellipse cx="0" cy="0" rx="145" ry="46" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="-65" y="-10" width="130" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="0.75"/>
    <text x="0" y="4" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b45309" letter-spacing="0.5">ELEMENTAL EQUATOR</text>

    <!-- Central Ethereal Envelope (5th Dimension / Hyperspace) -->
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="url(#ethGrad)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="0" y="70" text-anchor="middle" font-size="8" font-weight="bold" fill="#7e22ce">ETHEREAL ENVELOPE</text>

    <!-- Core Material Universe -->
    <circle cx="0" cy="0" r="28" fill="url(#matGrad)" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="0" y="-4" text-anchor="middle" font-size="7" font-weight="bold" fill="#0369a1">MATERIAL</text>
    <text x="0" y="6" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#0c4a6e">UNIVERSE</text>
    <text x="0" y="15" text-anchor="middle" font-size="5.5" fill="#0369a1">(Core 3D Nexus)</text>

    <!-- NORTH POLE: POSITIVE ENERGY PLANE (Top Zenith) -->
    <g transform="translate(0, -145)">
      <circle cx="0" cy="0" r="28" fill="url(#posGrad)" stroke="#78350f" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="0" y="-6" text-anchor="middle" font-size="7" font-weight="bold" fill="#451a03">NORTH POLE</text>
      <text x="0" y="3" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">POSITIVE</text>
      <text x="0" y="12" text-anchor="middle" font-size="7" font-weight="bold" fill="#78350f">ENERGY</text>
      <text x="0" y="-34" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b45309">▲ POSITIVE ENERGY POLE</text>
      <text x="0" y="-23" text-anchor="middle" font-size="7.5" fill="#78350f">Creation • Photons • Radiant Life</text>
    </g>

    <!-- SOUTH POLE: NEGATIVE ENERGY PLANE (Bottom Nadir) -->
    <g transform="translate(0, 145)">
      <circle cx="0" cy="0" r="28" fill="url(#negGrad)" stroke="#6b21a8" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="0" y="-6" text-anchor="middle" font-size="7" font-weight="bold" fill="#e9d5ff">SOUTH POLE</text>
      <text x="0" y="3" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">NEGATIVE</text>
      <text x="0" y="12" text-anchor="middle" font-size="7" font-weight="bold" fill="#e9d5ff">ENERGY</text>
      <text x="0" y="34" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#475569">▼ NEGATIVE ENERGY POLE</text>
      <text x="0" y="45" text-anchor="middle" font-size="7.5" fill="#334155">Antimatter • The Void • Entropy</text>
    </g>

    <!-- Equator Callouts on 3D Globe -->
    <!-- Left: Water -->
    <g transform="translate(-145, 0)">
      <circle cx="0" cy="0" r="14" fill="url(#waterGrad)" stroke="#1e3a8a" stroke-width="1.25"/>
      <text x="-18" y="3.5" text-anchor="end" font-size="8" font-weight="bold" fill="#1d4ed8">Water</text>
    </g>
    <!-- Right: Fire -->
    <g transform="translate(145, 0)">
      <circle cx="0" cy="0" r="14" fill="url(#fireGrad)" stroke="#991b1b" stroke-width="1.25"/>
      <text x="18" y="3.5" text-anchor="start" font-size="8" font-weight="bold" fill="#b91c1c">Fire</text>
    </g>
    <!-- Front: Earth -->
    <g transform="translate(0, 46)">
      <circle cx="0" cy="0" r="14" fill="url(#earthGrad)" stroke="#451a03" stroke-width="1.25"/>
      <text x="0" y="17" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Earth</text>
    </g>
    <!-- Back: Air -->
    <g transform="translate(0, -46)">
      <circle cx="0" cy="0" r="14" fill="url(#airGrad)" stroke="#0369a1" stroke-width="1.25"/>
      <text x="0" y="-16" text-anchor="middle" font-size="8" font-weight="bold" fill="#0284c7">Air</text>
    </g>
  </g>

  <!-- Dividing Subtle Vertical Separator -->
  <line x1="480" y1="80" x2="480" y2="500" stroke="#e2d8c3" stroke-width="1.25" stroke-dasharray="5 4"/>

  <!-- ========================================================================= -->
  <!-- RIGHT PANEL: THE ELEMENTAL EQUATOR (Top-Down Wheel, Center: 710, 280)    -->
  <!-- ========================================================================= -->
  <g transform="translate(710, 280)">
    
    <!-- Panel Label -->
    <text x="0" y="-188" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f" letter-spacing="0.5">The Elemental Equator (Clockwise Wheel)</text>
    <text x="0" y="-174" text-anchor="middle" font-size="8.5" fill="#64748b">Opposition Axes: Fire vs. Water &amp; Earth vs. Air</text>

    <!-- Outer Connective Orbit Circle & Cross Axes -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    <polygon points="0,-140 99,-99 140,0 99,99 0,140 -99,99 -140,0 -99,-99" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Opposition Axes Lines -->
    <!-- Vertical: Air (Top) <-> Earth (Bottom) -->
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Horizontal: Water (Left) <-> Fire (Right) -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Diagonals: Para-elemental axes -->
    <line x1="-99" y1="-99" x2="99" y2="99" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="99" y1="-99" x2="-99" y2="99" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Clockwise Direction Indicator -->
    <path d="M 45 -145 A 155 155 0 0 1 145 -45" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#goldArrow)"/>
    <text x="125" y="-120" font-size="7.5" font-weight="bold" fill="#b45309">Clockwise Sequence</text>

    <!-- Center: Material Nexus & Ethereal Plane -->
    <circle cx="0" cy="0" r="50" fill="url(#ethGrad)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="0" cy="0" r="26" fill="url(#matGrad)" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="0" y="-3" text-anchor="middle" font-size="7" font-weight="bold" fill="#0369a1">MATERIAL</text>
    <text x="0" y="6" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#0c4a6e">UNIVERSE</text>
    <text x="0" y="14" text-anchor="middle" font-size="5.5" fill="#0369a1">(Buffer)</text>
    <text x="0" y="38" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#7e22ce">Ethereal Plane</text>

    <!-- ==================== 8 ELEMENTAL & PARA-ELEMENTAL NODES ==================== -->

    <!-- 1. TOP (12:00): PLANE OF AIR -->
    <g transform="translate(0, -140)">
      <circle cx="0" cy="0" r="24" fill="url(#airGrad)" stroke="#0369a1" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="0" y="-3" text-anchor="middle" font-size="7" font-weight="bold" fill="#0f172a">PLANE OF</text>
      <text x="0" y="7" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0f172a">AIR</text>
      <text x="0" y="-30" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0284c7">1. AIR (Gases)</text>
    </g>

    <!-- 2. TOP-RIGHT (1:30): SMOKE -->
    <g transform="translate(99, -99)">
      <circle cx="0" cy="0" r="18" fill="url(#smokeGrad)" stroke="#475569" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#ffffff">SMOKE</text>
      <text x="18" y="-12" text-anchor="start" font-size="7.5" font-weight="bold" fill="#475569">2. Smoke (Air+Fire)</text>
    </g>

    <!-- 3. RIGHT (3:00): PLANE OF FIRE -->
    <g transform="translate(140, 0)">
      <circle cx="0" cy="0" r="24" fill="url(#fireGrad)" stroke="#991b1b" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="0" y="-3" text-anchor="middle" font-size="7" font-weight="bold" fill="#ffffff">PLANE OF</text>
      <text x="0" y="7" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#ffffff">FIRE</text>
      <text x="32" y="3.5" text-anchor="start" font-size="8.5" font-weight="bold" fill="#b91c1c">3. FIRE (Plasma)</text>
    </g>

    <!-- 4. BOTTOM-RIGHT (4:30): MAGMA -->
    <g transform="translate(99, 99)">
      <circle cx="0" cy="0" r="18" fill="url(#magmaGrad)" stroke="#78350f" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#ffffff">MAGMA</text>
      <text x="18" y="16" text-anchor="start" font-size="7.5" font-weight="bold" fill="#9a3412">4. Magma (Fire+Earth)</text>
    </g>

    <!-- 5. BOTTOM (6:00): PLANE OF EARTH -->
    <g transform="translate(0, 140)">
      <circle cx="0" cy="0" r="24" fill="url(#earthGrad)" stroke="#451a03" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="0" y="-3" text-anchor="middle" font-size="7" font-weight="bold" fill="#ffffff">PLANE OF</text>
      <text x="0" y="7" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#ffffff">EARTH</text>
      <text x="0" y="34" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#78350f">5. EARTH (Solid / 0 K)</text>
    </g>

    <!-- 6. BOTTOM-LEFT (7:30): MUD / OOZE -->
    <g transform="translate(-99, 99)">
      <circle cx="0" cy="0" r="18" fill="url(#mudGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="7" font-weight="bold" fill="#ffffff">MUD/OOZE</text>
      <text x="-18" y="16" text-anchor="end" font-size="7.5" font-weight="bold" fill="#334155">6. Mud/Ooze (Earth+Water)</text>
    </g>

    <!-- 7. LEFT (9:00): PLANE OF WATER -->
    <g transform="translate(-140, 0)">
      <circle cx="0" cy="0" r="24" fill="url(#waterGrad)" stroke="#1e3a8a" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="0" y="-3" text-anchor="middle" font-size="7" font-weight="bold" fill="#ffffff">PLANE OF</text>
      <text x="0" y="7" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#ffffff">WATER</text>
      <text x="-32" y="3.5" text-anchor="end" font-size="8.5" font-weight="bold" fill="#1d4ed8">7. WATER (Liquids)</text>
    </g>

    <!-- 8. TOP-LEFT (10:30): ICE / FROST -->
    <g transform="translate(-99, -99)">
      <circle cx="0" cy="0" r="18" fill="url(#iceGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="7" font-weight="bold" fill="#0c4a6e">ICE/FROST</text>
      <text x="-18" y="-12" text-anchor="end" font-size="7.5" font-weight="bold" fill="#0284c7">8. Ice/Frost (Water+Air)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM INFORMATIONAL PANELS & LEGEND                                      -->
  <!-- ========================================================================= -->
  <g transform="translate(36, 508)">
    <rect x="0" y="0" width="418" height="112" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
    <text x="14" y="20" font-size="10.5" font-weight="bold" fill="#78350f">Spherical Polar Dynamics &amp; Elemental Continuum</text>
    <text x="14" y="38" font-size="8.5" fill="#334155">• <tspan font-weight="bold">North Pole (Positive Energy):</tspan> Radiant life, photons, creation &amp; stellar power.</text>
    <text x="14" y="53" font-size="8.5" fill="#334155">• <tspan font-weight="bold">South Pole (Negative Energy):</tspan> The Void, antimatter, entropy &amp; dissolution.</text>
    <text x="14" y="68" font-size="8.5" fill="#334155">• <tspan font-weight="bold">Elemental Equator:</tspan> Continuous matter phases circling the Material Universe.</text>
    <text x="14" y="83" font-size="8.5" fill="#334155">• <tspan font-weight="bold">Opposition Balance:</tspan> Fire opposes Water; Earth opposes Air across the core.</text>
    <text x="14" y="98" font-size="8.5" fill="#334155">• <tspan font-weight="bold">Non-Central Gravity:</tspan> Elemental matter floats freely in 3D equilibrium.</text>
  </g>

  <g transform="translate(486, 508)">
    <rect x="0" y="0" width="418" height="112" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
    <text x="14" y="20" font-size="10.5" font-weight="bold" fill="#6b21a8">The Ethereal 5th-Dimension &amp; Pocket Demiplanes</text>
    <text x="14" y="38" font-size="8.5" fill="#334155">• <tspan font-weight="bold">5th-Dimension (Hyperspace):</tspan> Envelops and coexists with physical 3D space.</text>
    <text x="14" y="53" font-size="8.5" fill="#334155">• <tspan font-weight="bold">Energy Bridge:</tspan> Light, heat &amp; lasers penetrate across the planar boundary.</text>
    <text x="14" y="68" font-size="8.5" fill="#334155">• <tspan font-weight="bold">Spatial Folding:</tspan> Enables faster-than-light (FTL) transit and teleportation.</text>
    <text x="14" y="83" font-size="8.5" fill="#334155">• <tspan font-weight="bold">Phased Matter:</tspan> Ethereal substances traverse solid obstacles without friction.</text>
    <text x="14" y="98" font-size="8.5" fill="#334155">• <tspan font-weight="bold">Demiplanes:</tspan> Localized dimensional folds (Demiplane of Shadow, Time, Pockets).</text>
  </g>

</svg>
