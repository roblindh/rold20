  -
    ID: 34
    Name: 'Weapons - Slings'
    Abbreviation: WpSln
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Slings is the skill you use with sling-type weapons.'
  -
    ID: 35
    Name: 'Weapons - Small Thrown'
    Abbreviation: WpSmT
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Small Thrown makes you more proficient in throwing daggers, shurikens, darts, and similar small weapons.'
  -
    ID: 36
    Name: 'Weapons - Area Attacks'
    Abbreviation: WpAre
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: "Weapons - Area Attacks is a skill that improves your attack proficiency with bursts, spreads, emanations and other attacks that cover a large physical area and normally target a victim's Reflex defense."
  -
    ID: 37
    Name: 'Weapons - Body & Mind Attacks'
    Abbreviation: WpBaM
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: "Weapons - Body & Mind Attacks makes you more proficient in any attacks that target the victim's Fortitude and Will defenses."
  -
    ID: 38
    Name: 'Weapons - Ray Attacks'
    Abbreviation: WpRay
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Ray Attacks is the skill you use with any spell, device, or power that fires a ray (typically against DeC).'
  -
    ID: 39
    Name: 'Weapons - Siege'
    Abbreviation: WpSie
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Siege is the skill you use to load and fire siege weapons.'
  -
    ID: 40
    Name: 'Armor - Light'
    Abbreviation: ArmLt
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Armor - Light is a skill that teaches you how to effectively wear and move in light armor.'
  -
    ID: 41
    Name: 'Armor - Medium'
    Abbreviation: ArmMd
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Armor - Medium is a skill that teaches you how to effectively wear and move in armor of medium weight and rigidity.'
  -
    ID: 42
    Name: 'Armor - Heavy'
    Abbreviation: ArmHv
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Armor - Heavy is a skill that teaches you how to effectively wear heavy and rigid suits of armor.'
  -
    ID: 43
    Name: Berserking
    Abbreviation: Bersk
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Berserking is a skill that lets you enter a blood frenzy, temporarily increasing your physical strength and resilience.\nInspired by the 3.5E Barbarian class.'
  -
    ID: 44
    Name: 'Combat Instincts'
    Abbreviation: CmbIn
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Combat Instincts is a skill that reflects your amount of combat experience and how quickly you respond in combat situations.'
  -
    ID: 45
    Name: 'Damage Reduction'
    Abbreviation: DmRed
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Damage reduction is a skill that gradually gives you improved pain tolerance and resistance to physical damage.\nInspired by the 3.5E Barbarian class.'
  -
    ID: 46
    Name: 'Danger Sense'
    Abbreviation: DaSns
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Danger Sense is a combination of instinctive reflexes and a suspicious personality.\nInspired by the 3.5E Barbarian and Rogue classes.'
  -
    ID: 47
    Name: 'Defensive Stance'
    Abbreviation: DefSt
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Defensive Stance is a skill that can turn you into a veritable bastion of defense, increasing your strength, resilience, and defenses as long as you remain in the same spot.\nInspired by the 3.5E Dwarven Defender prestige class.'
  -
    ID: 48
    Name: 'Enemy Specialization'
    Abbreviation: EnSpc
    Type: 3
    Specializations: 1
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Enemy Specialization is a skill that teaches you the strengths and weaknesses of particular creature types.\nInspired by the 3.5E Ranger class.'
  -
    ID: 49
    Name: 'Fighting Style - Akimbo'
    Abbreviation: FSMul
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Fighting Style - Akimbo teaches you how to wield multiple weapons and make multiple attacks simultaneously. The Akimbo Attack action shows the maximum number of simultaneous attacks you can perform and the base penalty on each attack. Note that in order to perform a "double attack", you also need to wield two weapons (or a double weapon), three weapons for a "triple attack", etc. For most humanoids, this means that anything beyond a "double attack" has to involve natural weapons. For example, a very skilled human wielding two daggers could perform up to a "quintuple attack" by using both daggers in combination with a double kick and a head-butt.'
  -
    ID: 50
    Name: 'Fighting Style - Mobility'
    Abbreviation: FSMob
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Fighting Style - Mobility is a skill that teaches different ways to stay mobile on a battlefield and to quickly switch between multiple opponents.'
  -
    ID: 51
    Name: Sniping
    Abbreviation: Snipe
    Type: 10
    Specializations: null
    Prereqs: 'Skl(WpBow)>=5 AND Skl(VitAt)>=5'
    PrereqMaxLvl: 'MIN(Skl(WpBow)-5,Skl(VitAt)-5)'
    Description: 'Sniping is a skill that teaches you how to make stealthy and deadly ranged attacks. This skill is extremely difficult to learn and typically requires being taught by one who has already mastered it. It is practiced by elves and half-elves, but other cultures specializing in stealth and ranged weapons may also use it (and possibly with other weapons than bows).\nInspired by the Midnight Elven Raider prestige class.'
  -
    ID: 52
    Name: 'Vital Attack'
    Abbreviation: VitAt
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Vital Attack is the ability to strike the most vulnerable and sensitive spots on your enemies. Note that creatures that have no vital organs, such as most undead, constructs, and others, are resistant to critical hits and indirectly also to vital attacks.\nInspired by the 3.5E Rogue class.'
  -
    ID: 53
    Name: Warfare
    Abbreviation: Warfr
    Type: 3
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Warfare is a skill that teaches you strategy, army tactics, leadership, and science related to mass combat.'
  -
    ID: 54
    Name: 'Arcane - Abjuration'
    Abbreviation: ArcAb
    Type: 4
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Arcane - Abjuration is a skill that lets you cast arcane spells related to protection, resistance, wards, etc. See the magic rules for more details about spells and spell casting.'
  -
