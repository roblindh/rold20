skills:
  -
    ID: 1
    Name: Acrobatics
    Abbreviation: Acrob
    Type: 1
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Acrobatics is a skill that covers physical actions governed more by balance and agility than by brute strength. The more strength-based actions are covered by Athletics.'
  -
    ID: 2
    Name: 'Animal Empathy'
    Abbreviation: AnEmp
    Type: 1
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Animal Empathy is a skill that you use to interact with domesticated as well as wild animals. It can be used to improve their attitude towards you, get them to do as you want, or even turn wild animals into domesticated ones.\nInspired by the 3.5E Druid and Ranger classes.'
  -
    ID: 3
    Name: Athletics
    Abbreviation: Athle
    Type: 1
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Athletics is a skill that covers physical actions governed more by strength than by agility. The more agility-based actions are covered by Acrobatics.'
  -
    ID: 4
    Name: Crafting
    Abbreviation: Craft
    Type: 1
    Specializations: 1
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Crafting is a combination of all the skills used to create and repair stuff, from cutting gems to building ships. Realistically, there should be a separate skill for each craft, but they have been combined into a single skill for the sake of simplicity (and to make the skill more attractive for player characters).'
  -
    ID: 5
    Name: Healing
    Abbreviation: Heal
    Type: 1
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Healing is a skill that covers most knowledge related to medicine, anatomy, pharmacology, toxicology, pathology, etc. Whether the actions related to this skill involve traditional medicine, acupuncture, massage, or something more exotic depends on the campaign.'
  -
    ID: 6
    Name: Knowledge
    Abbreviation: Know
    Type: 1
    Specializations: 1
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Knowledge is a combination of several areas of academic study and lore. Knowledge that is used for practical rather than academic purposes belongs to the Crafting, Profession, or even Survival skills. Realistically, there should be a separate skill for each type of knowledge, but they have been combined into a single skill for the sake of simplicity (and to make the skill more attractive for player characters).'
  -
    ID: 7
    Name: Linguistics
    Abbreviation: Lingu
    Type: 1
    Specializations: 3
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Linguistics is a measure of how many languages you speak, and it also represents a general academic knowledge of languages and alphabets. Realistically, there should be a separate skill for each language, but they have been combined into a single skill for the sake of simplicity (and to make the skill more attractive for player characters).\nThe first time you specialize in a language, you learn its alphabet and its basics. The second time, you become nearly fluent. The third time, you learn to speak the language with little or no accent. This is one of very few skills where you can spend more than one skill point per specialization.'
  -
    ID: 8
    Name: Perception
    Abbreviation: Percp
    Type: 1
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Perception is the skill you use to find hidden things, hear sneaking enemies, spot an ambush, etc.'
  -
    ID: 9
    Name: Perform
    Abbreviation: Perfm
    Type: 1
    Specializations: 1
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Perform is a combination of several types of artistic expression. Realistically, there should be a separate skill for each type of art, but they have been combined into a single skill for the sake of simplicity (and to make the skill more attractive for player characters).'
  -
    ID: 10
    Name: Profession
    Abbreviation: Prof
    Type: 1
    Specializations: 1
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Profession is a combination of several different occupational skills. Realistically, there should be a separate skill for each type of occupation, but they have been combined into a single skill for the sake of simplicity (and to make the skill more attractive for player characters). There are several similarities (and probably overlaps) between the Profession and Crafting skills, but generally speaking, Profession specialties are broader and much less focused on creating and repairing things.'
  -
    ID: 11
    Name: Psychology
    Abbreviation: Psych
    Type: 1
    Specializations: 1
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Psychology is a skill that can be used to actively influence other people in various ways. It can also be used more passively, to analyze the behavior of others.'
  -
    ID: 12
    Name: Riding
    Abbreviation: Ride
    Type: 1
    Specializations: 1
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Riding represents the ability to ride and take care of any type of mount, including those that are aerial or aquatic. A mount must be at least one size category larger than the rider, and it has to be either trained or willing to carry a rider. Some mounts are also trained for combat, although natural predators do not require such training.'
  -
    ID: 13
    Name: Composure
    Abbreviation: Compo
    Type: 1
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Composure is a skill that improves your mental discipline, offering some protection against mental attacks, magical as well as mundane detections, et.al.'
  -
    ID: 14
    Name: Stealth
    Abbreviation: Steal
    Type: 1
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Stealth is a skill that you use to avoid detection, by hiding, sneaking, or just being inconspicuous.'
  -
    ID: 15
    Name: Survival
    Abbreviation: Surv
    Type: 1
    Specializations: 1
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Survival is a skill that covers most of the expertise necessary to survive in a wilderness setting, including how to find food, find water, avoid getting lost, etc.'
  -
    ID: 16
    Name: Thievery
    Abbreviation: Thiev
    Type: 1
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Thievery is a skill that covers most dexterity-based subterfuge actions, such as opening a lock, escaping manacles, picking a pocket, circumventing a trap, etc.'
  -
    ID: 17
    Name: 'Weapons - Natural'
    Abbreviation: WpNat
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Natural is the skill used for all natural weapons, including hands, feet, claws, teeth, tails, etc.'
  -
    ID: 18
    Name: 'Weapons - Brawling'
    Abbreviation: WpBrl
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Brawling is used when you are grappling or tackling your opponents.\nNote that although natural weapons are often used when making grapple attacks, this skill is used in place of Weapons - Natural to calculate the bonuses while grappling.'
  -
    ID: 19
    Name: 'Weapons - Generic'
    Abbreviation: WpGen
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Generic is a skill that gives you basic proficiency with most weapons, from axes and swords to crossbows and slings. The bonuses granted by this skill can be used for all weapons belonging to the generic group, and they can also be used in place of Weapons - Brawling skill modifiers and Weapons - Ray skill modifiers.'
  -
    ID: 20
    Name: 'Weapons - Exotic'
    Abbreviation: WpExo
    Type: 2
    Specializations: 1
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Exotic is a skill that makes you more proficient in fighting with certain exotic weapons. It also makes you more capable when fighting with improvised weapons.'
  -
    ID: 21
    Name: 'Weapons - Axes'
    Abbreviation: WpAxe
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Axes is a skill that turns you into an expert axe fighter.'
  -
    ID: 22
    Name: 'Weapons - Clubs'
    Abbreviation: WpClb
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Clubs makes you better at attacking with clubs, maces, and other clubbing weapons.'
  -
    ID: 23
    Name: 'Weapons - Fencing'
    Abbreviation: WpFnc
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Fencing is the skill used for all fencing weapons (usually blades that rely more on precise attacks than on brute force).'
  -
    ID: 24
    Name: 'Weapons - Flails'
    Abbreviation: WpFll
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Flails is the skill you use when fighting with the flail type of weapons.'
  -
    ID: 25
    Name: 'Weapons - Heavy Blades'
    Abbreviation: WpHvB
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Heavy Blades is the skill used for large swords and other similar weapons.'
  -
    ID: 26
    Name: 'Weapons - Light Blades'
    Abbreviation: WpLtB
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Light Blades is the skill used for all small swords, daggers, knives, and other small blades.'
  -
    ID: 27
    Name: 'Weapons - Pole Arms'
    Abbreviation: WpPlA
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Pole Arms makes you more proficient in fighting with pole arm weapons.'
  -
    ID: 28
