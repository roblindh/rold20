  -
    ID: 171
    Name: Familiar
    Abbreviation: Famil
    Type: 8
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Familiar is a skill that lets you summon a special animal to serve as your familiar. As your skill level increases, you can either improve your familiar (see Rules of Culture for details) or replace it with a more versatile creature. Unless the DM specifically allows it, you can never have more than one familiar. If a familiar dies or is dismissed/replaced by you, it will take one year before a new one can be summoned.\nThe familiar must be an animal or monstrous animal at least one size category smaller than you, and the CL of your familiar must not exceed your (skill level - 1). If the DM allows multiple familiars, the sum of their CL must not exceed your (skill level - 1).\nEmpathic Link [Su]: You can communicate empathically with your familiar to a range of 1 km (no AP cost).\nWhen the familiar is within 1 sq, you gain a +2 skill level bonus on Perception.\nWhen the familiar is within 1 km, you gain a +2 skill level bonus on one of the familiar''s racial skills (chosen when the familiar is summoned).\nAny spell you cast on yourself can automatically affect your familiar as well (1 sq range; no extra cost; effect ends if the familiar moves more than 1 sq from master).\nWhen the familiar is within 1 sq, it can use your Fort, Ref, and Will defenses (if they are better).\nInspired by the 3.5E Sorcerer and Wizard classes.'
