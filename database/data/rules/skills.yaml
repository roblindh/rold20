    Abbreviation: WpShd
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Shields is a skill that improves your ability to fight and defend yourself with a shield.'
  -
    ID: 29
    Name: 'Weapons - Spears'
    Abbreviation: WpSpr
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Spears is the skill used for fighting with spears, lances, and other similar weapons.'
  -
    ID: 30
    Name: 'Weapons - Staves'
    Abbreviation: WpStv
    Type: 2
    Specializations: null
    Prereqs: null
    PrereqMaxLvl: null
    Description: 'Weapons - Staves makes you more proficient in fighting with staves and other similar weapons.'
  -
