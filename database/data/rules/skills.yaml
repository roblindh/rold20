    Description: 'Divine Mount is a special skill that grants you the service of an exceptional extraplanar steed. As your skill level increases, you can either improve your mount (see Rules of Culture for details) or replace it with a more versatile one. Releasing a mount from your service and replacing it with a new one requires a one-day ritual but carries no other cost. If a mount dies, however, it will take thirty days before a new one can be called. The mount must be an animal or monstrous animal that can carry a rider, and the CL of your mount must not exceed your (skill level - 1).\nEmpathic Link [Su]: You can communicate empathically with your mount to a range of 1 km (no AP cost).\nAny spell you cast on yourself can automatically affect your mount as well (1 sq range; no extra cost; effect ends if the mount moves more than 1 sq from master).\nWhen you are mounted, the mount can use your Fort, Ref, and Will defenses (if they are better).\nInspired by the 3.5E Paladin class.'
