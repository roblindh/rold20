creaturetypes:
  -
    ID: 1
    Name: Aberrations
    Description: 'An aberration has a bizarre anatomy, strange abilities, an alien mindset, or any combination of the above.'
    GroupTraits: null
  -
    ID: 2
    Name: Animals
    Description: 'An animal is a living, non-humanoid creature, usually a vertebrate with no magical abilities and no innate capacity for language or culture.'
    GroupTraits: null
  -
    ID: 3
    Name: 'Animals, Monstrous'
    Description: 'A monstrous animal is an animal with unusual abilities or exceptional size.'
    GroupTraits: null
  -
    ID: 4
    Name: Constructs
    Description: 'A construct is an animated object or artificially constructed creature.'
    GroupTraits: 'DefMod { Qual=NecroticRes; Type=racial; Value=+999; } DefMod { Qual=RadiantRes; Type=racial; Value=+999; } Defense { Qual=AbilDmgRes; Type=racial; Value=+999; } Defense { Qual=CritRes; Type=racial; Value=+20; } Defense { Qual=DiseaseRes; Type=racial; Value=+999; } Defense { Qual=MentalRes; Type=racial; Value=+999; } Defense { Qual=ParalysisRes; Type=racial; Value=+999; } Defense { Qual=PoisonRes; Type=racial; Value=+999; } Defense { Qual=SuffocateRes; Type=racial; Value=+999; }'
  -
    ID: 5
    Name: Dragons
    Description: 'A dragon is a reptilelike creature, usually winged, intelligent, and with magical or unusual abilities.'
    GroupTraits: null
  -
    ID: 6
    Name: Elementals
    Description: 'An elemental is a being composed of one (or several) of the four classical elements: air, earth, fire, or water.'
    GroupTraits: 'Defense { Qual=CritRes; Type=racial; Value=+20; } Defense { Qual=ParalysisRes; Type=racial; Value=+999; } Defense { Qual=PoisonRes; Type=racial; Value=+999; } Defense { Qual=SleepRes; Type=racial; Value=+999; } Defense { Qual=SuffocateRes; Type=racial; Value=+999; }'
  -
    ID: 7
    Name: Humanoids
    Description: 'A humanoid usually has two arms, two legs, and one head, or at least a humanlike torso, arms, and a head. Humanoids have few or no supernatural or extraordinary abilities, but most can speak and usually have well-developed societies. They usually are of Small or Medium size.'
    GroupTraits: null
  -
    ID: 8
    Name: 'Humanoids, Monstrous'
    Description: 'A monstrous humanoid is a humanoid with supernatural or extraordinary abilities, or at least one of extraordinary size.'
    GroupTraits: null
  -
    ID: 9
    Name: Outsiders
    Description: 'An outsider is at least partially composed of the essence (but not necessarily the material) of some plane other than the Material Plane. Some creatures start out as some other type and become outsiders when they attain a higher (or lower) state of spiritual existence.'
    GroupTraits: null
  -
    ID: 10
    Name: 'Plants & Fungi'
    Description: 'This type comprises vegetable creatures. Note that regular plants, such as those growing in gardens and fields, lack Wisdom and Charisma scores and are considered objects rather than creatures, even though they are classified as alive.'
    GroupTraits: 'Sns { Qual=LifeSense; Value=6; } Sns { Qual=Blind; } Defense { Qual=CritRes; Type=racial; Value=+10; } Defense { Qual=MentalRes; Type=racial; Value=+999; } Defense { Qual=ParalysisRes; Type=racial; Value=+999; } Defense { Qual=PoisonRes; Type=racial; Value=+999; } Defense { Qual=PolymorphRes; Type=racial; Value=+999; }'
  -
    ID: 11
    Name: Undead
    Description: 'Undead are once-living creatures animated by spiritual or supernatural forces.'
    GroupTraits: 'Sns { Qual=LifeSense; Value=12; } DefMod { Qual=NecroticRes; Type=racial; Value=+999; } Defense { Qual=AbilDmgRes; Type=racial; Value=+999; } Defense { Qual=CritRes; Type=racial; Value=+10; } Defense { Qual=DiseaseRes; Type=racial; Value=+999; } Defense { Qual=MentalRes; Type=racial; Value=+999; } Defense { Qual=ParalysisRes; Type=racial; Value=+999; } Defense { Qual=PoisonRes; Type=racial; Value=+999; } Defense { Qual=SuffocateRes; Type=racial; Value=+999; } Defense { Qual=Vulnerable; Type=Radiant; Value=50; }'
