buildingfeatures:
  -
    ID: 1
    Feature: 'Wall, unworked stone'
    Effect: 'Usually at least 1.5 m thick; DR: 8, HP: 6/cm; DC 15 for climbing.'
  -
    ID: 2
    Feature: 'Wall, reinforced'
    Effect: 'Masonry wall reinforced with iron bars; DR: 8; HP: 12/cm; +10 DC to break through; DC 15 for climbing.'
  -
    ID: 3
    Feature: 'Wall, magically treated'
    Effect: 'Typically doubles DR and HP; +20 DC to break through.'
  -
    ID: 4
    Feature: 'Arrow slit'
    Effect: 'Provides good cover for adjacent creatures (relative to the other side).'
  -
    ID: 5
    Feature: 'Floor, flagstone'
    Effect: 'Most common dungeon floor.'
  -
    ID: 6
    Feature: 'Floor, uneven flagstone'
    Effect: 'Running and charging requires DC 10 Balance check.'
  -
    ID: 7
    Feature: 'Floor, hewn stone'
    Effect: 'Running and charging requires DC 10 Balance check.'
  -
    ID: 8
    Feature: 'Floor, natural stone'
    Effect: 'Typically counts as difficult terrain, and traversal of some parts may require Climb or Jump checks.'
  -
    ID: 9
    Feature: 'Door, secret'
    Effect: 'Disguised as part of a wall or other architectural feature, this door requires a Search check to detect (usual DC between 20 and 30).'
  -
    ID: 10
    Feature: 'Stairs or ramp, normal'
    Effect: 'Counts as diagonal movement (×1.5 movement cost); attackers above a defender can gain +1 melee attack bonus for higher ground.'
  -
    ID: 11
    Feature: 'Stairs or ramp, steep'
    Effect: 'Counts as difficult terrain; higher ground melee attack bonus; running, charging, and fighting require Balance checks and may result in falls up to d4 squares.'
  -
    ID: 12
    Feature: 'Stairs, spiral'
    Effect: 'Same as normal or steep stairs; central support can provide cover for defenders that are above their attackers.'
  -
    ID: 13
    Feature: 'Bridge, rope'
    Effect: 'Counts as difficult terrain; if only one supporting rope remains attached, make +5 attack against Ref for creatures on the bridge (S - creature falls), and movement requires DC 15 Climb check.'
  -
    ID: 14
    Feature: Statue
    Effect: 'Can provide cover (depending on size); DC 15 for climbing.'
  -
    ID: 15
    Feature: Tapestry
    Effect: 'Can provide up to total concealment (depending on size and position); DC 15 for climbing.'
  -
    ID: 16
    Feature: Elevator
    Effect: 'Can be mechanical or magical; typically ascends or descends 2 squares (3 m) per round.'
  -
    ID: 17
    Feature: Ladders
    Effect: 'DC 0 for climbing.'
  -
    ID: 18
    Feature: 'Wall, shifting'
    Effect: 'Shifting walls are often parts of traps and secret doors; otherwise treat as walls of same material.'
