    Terrain: 'Stalagmite (or stalactite)'
    Effect: 'Can provide different levels of cover, depending on size; DC 20 for climbing.'
environmenteffects:
  -
    ID: 1
    Environment: 'Precipitation, heavy rain'
    Effect: 'PAM -1 and MAM -2; reduced visibility<sup>1</sup>.'
  -
    ID: 2
    Environment: 'Precipitation, heavy snow'
    Effect: 'Reduced visibility<sup>1</sup>.'
  -
    ID: 3
    Environment: 'Fog, light'
    Effect: 'Reduced visibility<sup>1</sup>.'
  -
    ID: 4
    Environment: 'Fog, dense'
    Effect: 'Extremely reduced visibility<sup>3</sup>.'
  -
    ID: 5
    Environment: 'Gravity, heavy'
    Effect: 'PAM and attack penalty -2 or more; increased weight of equipment; reduced weapon range; increased falling damage.'
  -
    ID: 6
    Environment: 'Gravity, low'
    Effect: 'PAM and attack penalty -2 to -6 until adapted; decreased weight of equipment; increased weapon range; reduced falling damage.'
  -
    ID: 7
    Environment: 'Gravity, none'
    Effect: 'PAM and attack penalty -6 until adapted; equipment has no weight but full inertia; weapon range only limited by friction; no falling damage.'
  -
    ID: 9
    Environment: Sandstorm
    Effect: 'PAM -2 and MAM -5; very reduced visibility<sup>2</sup>; unprotected creatures suffer 1d3 SP per hour.'
  -
    ID: 10
    Environment: 'Cold (-18&deg; to +4&deg; C)'
    Effect: 'Unprotected and non-resistant creatures suffer +5 attack vs. Fort once per hour (S - 1d6 SP). Increase the attack by +1 per check. In water, check once per minute. Also, while in water or wet, increase the attack by +10.'
  -
    ID: 11
    Environment: 'Cold, severe (-28&deg; to -18&deg; C)'
    Effect: 'Unprotected and non-resistant creatures suffer a +5 attack vs. Fort once per 10 min (S - 1d6 SP). Increase the attack by +1 per check. Winter clothing changes interval to once per hour. In water, check once per 3 rounds. Also, while in water or wet, increase the attack by +10.'
  -
    ID: 12
    Environment: 'Cold, extreme (-50&deg; to -28&deg; C)'
    Effect: 'Unprotected and non-resistant creatures suffer a +5 attack (+1 per additional check) vs. Fort once per 10 min (S - 1d6 SP and 1d6 HP). In water, check once per minute. Also, while in water or wet, increase the attack by +10.'
  -
    ID: 13
    Environment: 'Heat (32&deg; to 42&deg; C)'
    Effect: 'Unprotected and non-resistant creatures suffer a +5 attack (+1 per additional check; +4 against creatures with heavy armor or clothing) vs. Fort once per hour (S - 1d4 SP).'
  -
    ID: 14
    Environment: 'Heat, severe (42&deg; to 60&deg; C)'
    Effect: 'Unprotected and non-resistant creatures suffer a +5 attack (+1 per additional check; +4 against creatures with heavy armor or clothing) vs. Fort once per 10 min (S - 1d4 SP).'
  -
    ID: 15
    Environment: 'Heat, extreme (60&deg; to 80&deg; C)'
    Effect: 'Unprotected and non-resistant creatures suffer a +5 attack (+1 per additional check; +4 against creatures with heavy armor or clothing) vs. Fort once per 10 min (S - 1d6 SP and 1d6 HP).'
  -
    ID: 16
    Environment: Fire
    Effect: 'Up to 10d6 HP fire damage per round. 1d6 HP for minor exposure. Worn and carried equipment may also be damaged. Flammable items may catch fire.'
  -
    ID: 17
    Environment: 'Water, boiling'
    Effect: '10d6 HP fire (actually heat) damage per round.'
  -
    ID: 18
    Environment: 'Lava / magma'
    Effect: '20d6 HP fire damage per round. 2d6 HP for minor exposure. Continues for 1d3 rounds at 1/2 damage. Flowing lava typically moves 3 to 12 squares per round.'
  -
    ID: 19
    Environment: Smoke
    Effect: 'Very reduced visibility<sup>2</sup>; +5 attack vs. Fort once per round (S - 1d6 SP and become dazed for one round).'
  -
    ID: 20
    Environment: 'Acid, strong'
    Effect: '10d6 HP acid damage per round for immersion. 1d6 HP for minor exposure. Many strong acids also produce poisonous fumes (+5 attack vs. Fort once per round; S - 1d6 SP and become dazed for one round).'
  -
    ID: 21
    Environment: 'Pressure, high'
    Effect: 'For actions that cost SP, multiply cost by 5 for unadapted creatures.'
  -
    ID: 22
    Environment: 'Pressure, low'
    Effect: 'For actions that cost SP, multiply cost by 2 for unadapted creatures (at altitudes above 2 km). Altitudes above 5 km also result in a +5 attack vs. Fort once per 6 h (S - 1 point of damage to each ability score).'
  -
    ID: 23
    Environment: 'Fog, medium'
    Effect: 'Very reduced visibility<sup>2</sup>.'
  -
    ID: 24
    Environment: 'Loud noise'
    Effect: '-4 circumstance penalty on actions based on hearing.'
  -
    ID: 25
    Environment: 'Loud noise, very'
    Effect: '-8 circumstance penalty on actions based on hearing.'
  -
    ID: 26
    Environment: 'Loud noise, extremely'
    Effect: '-12 circumstance penalty on actions based on hearing. Sufficiently loud noise causes sonic energy damage.'
  -
    ID: 27
    Environment: 'Wind, strong (10 to 15 m/s)'
    Effect: '-2 attack penalty for ranged weapons; +0 attack vs. Fort each round (S - double movement cost against wind; CS - unable to move against wind for 1 r); extinguish unprotected candles.\nAlso note that exposure to winds can increase the effect of extreme temperatures, low as well as high.'
  -
    ID: 28
    Environment: 'Wind, severe (15 to 25 m/s)'
    Effect: '-4 attack penalty for ranged weapons; +5 attack vs. Fort each round (S - double movement cost against wind; ES - unable to move against wind for 1 r; CS - knocked prone); extinguish unprotected candles and torches; loose debris causes reduced visibility<sup>1</sup>.\nAlso note that exposure to winds can increase the effect of extreme temperatures, low as well as high.'
  -
    ID: 29
    Environment: 'Wind, stormy (25 to 40 m/s)'
    Effect: 'PAM -1 and MAM -2; -10 attack penalty for ranged weapons (-4 for siege weapons); +8 attack vs. Fort each round (S - double movement cost against wind; ES - unable to move against wind for 1 r; CS - knocked prone and carried with wind); extinguish even protected flames; loose debris causes very reduced visibility<sup>2</sup>.\nAlso note that exposure to winds can increase the effect of extreme temperatures, low as well as high.'
  -
    ID: 30
    Environment: 'Wind, hurricane (40 to 90 m/s)'
    Effect: 'PAM -2 and MAM -5; -20 attack penalty for ranged weapons (-8 for siege weapons); +10 attack vs. Fort each round (S - double movement cost against wind; ES - unable to move against wind for 1 r; CS - knocked prone and carried with wind); extinguish even protected flames; can fell trees; loose debris causes extremely reduced visibility<sup>3</sup>.\nAlso note that exposure to winds can increase the effect of extreme temperatures, low as well as high.'
  -
    ID: 31
    Environment: 'Wind, tornado (more than 90 m/s)'
    Effect: 'PAM -5 and MAM -10; -30 attack penalty for ranged weapons (-12 for siege weapons); +20 attack vs. Fort each round (S - 2d6 HP blunt damage and double movement cost against wind; ES - 4d6 HP blunt damage and unable to move against wind for 1 r; CS - 6d6 HP blunt damage, knocked prone, and carried with wind); extinguish even protected flames; loose debris causes extremely reduced visibility<sup>3</sup>.\nAlso note that exposure to winds can increase the effect of extreme temperatures, low as well as high.'
  -
    ID: 32
    Environment: 'Water, flowing'
    Effect: 'Fast streams (2 to 8 sq of movement per round) count as rough water, while rapids (above 8 sq of movement per round) count as stormy water. Rapids can cause SP and HP damage due to rocks and flotsam, even with successful swimming checks.'
  -
    ID: 33
    Environment: 'Cold, unearthly (-50&deg; C or lower)'
    Effect: 'Unprotected and non-resistant creatures suffer a +5 attack (+1 per additional check) vs. Fort once per minute (S - 1d6 SP and 1d6 HP). In water, check once per round. Also, while in water or wet, increase the attack by +10.'
  -
    ID: 34
    Environment: 'Heat, unearthly (80&deg; to 100&deg; C)'
    Effect: 'Unprotected and non-resistant creatures suffer a +5 attack (+1 per additional check; +4 against creatures with heavy armor or clothing) vs. Fort once per minute (S - 1d6 SP and 1d6 HP).'
  -
    ID: 35
    Environment: 'Heat, burning (100&deg; C or more)'
    Effect: 'Unprotected and non-resistant creatures suffer 2d6 HP of fire/heat damage per round. Combustible materials may catch fire.'
  -
    ID: 36
    Environment: 'Precipitation, hail'
    Effect: '-4 circumstance penalty on actions based on hearing. On rare occasions, hail can become large enough to cause 1-2 HP of damage to unprotected creatures and items.'
  -
    ID: 37
    Environment: 'Precipitation, downpour'
    Effect: 'PAM -2 and MAM -4; very reduced visibility<sup>2</sup>. Downpours can lead to floods.'
  -
    ID: 38
    Environment: 'Precipitation, very heavy snow'
    Effect: 'Very reduced visibility<sup>2</sup>. Snowdrifts count as difficult or very difficult terrain.'
  -
    ID: 39
    Environment: Duststorm
    Effect: 'Reduced visibility<sup>1</sup>. Leaves behind a thick deposit of fine dust and sand.'
  -
    ID: 40
    Environment: Ice
    Effect: 'Counts as very slippery. See List of Equipment - Materials for the Break DC, DR, and HP of ice and calculate based on thickness.'
  -
    ID: 41
    Environment: 'Atmosphere, toxic'
    Effect: 'When inhaled, causes 2d6 SP of poison damage per round. Might also act like fog.'
