    Terrain: 'Slope, gradual'
    Effect: '+1 attack bonus against downhill defenders.'
  -
    ID: 6
    Terrain: 'Slope, steep'
    Effect: 'Difficult terrain (x2 cost); -2 PAM.'
  -
    ID: 7
    Terrain: 'Tree canopy, dense'
    Effect: 'Provides good concealment; DC 15 for climbing.'
  -
    ID: 8
    Terrain: 'Tree canopy, sparse'
    Effect: 'Provides concealment; DC 15 for climbing.'
  -
    ID: 9
    Terrain: 'Tree, massive'
    Effect: 'Fills entire square; provides good or total cover; DR: 5, HP: 600; DC 15 for climbing.'
  -
    ID: 10
    Terrain: 'Tree, normal'
    Effect: 'Difficult terrain in one square (x2 cost); provides cover; DR: 5, HP: 150; DC 15 for climbing.'
  -
    ID: 11
    Terrain: 'Undergrowth, heavy'
    Effect: 'Difficult terrain (x4 cost); -4 PAM; provides good concealment (-8 circumstance penalty on Search and Spot checks).'
  -
    ID: 12
    Terrain: 'Undergrowth, light'
    Effect: 'Difficult terrain (x2 cost); -2 PAM; provides concealment (-4 circumstance penalty on Search and Spot checks).'
  -
