    Options: 'Animal option: Normal animals will not willingly enter the area.\nEthereal option: The alarm will also trigger on incorporeal and extradimensional creatures.\nProtection option [Illusion]: When the ward triggers, a number of protective effects take place. The area fills with dense fog (as in Fog Cloud spell), all doors become magically held (as in Hold Object spell), stairways are filled with strong entangling webs, up to ten doors can be hidden behind illusory walls, and the fog can be made nauseating in two separate positions. All of these effects have a duration of one day.'
