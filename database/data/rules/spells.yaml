    Options: 'Extendable option (only for claws): You can extend your claws greatly, increasing your reach by 1 square and making the claws count as one size larger.\nPain strike option: Your natural weapons also cause 1d6 SP of damage with each successful attack.\nGraft weapon option (req Psi - Psychometabolism; only for claws): Instead of turning your hands into beastly claws, you graft one or two one-handed weapons onto your hand or hands. A grafted weapon gains a +1 circumstance bonus to attack, parry, and damage, and it cannot be disarmed. However, a hand with a grafted weapon cannot be used as a regular hand (with the penalties this entails).'
