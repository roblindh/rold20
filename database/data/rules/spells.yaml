 Aeromancy or Divine - Elements; [Sonic]): +5 attack against Ref (S - 6d6 HP of sonic damage in a 1 sq radius; F - half damage). The trapped object takes no damage.\nConcealment: The glyph is nearly invisible and hard to find by Perception (DC 15 + PL) or detection spells (opposed spellcasting check).'
