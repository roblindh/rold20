    Description: 'The basic spell grants a resistance bonus to defenses against spells and other supernatural effects.'
    Options: 'Specific MR option: You grant the targets magic resistance equal to your skill level against all spells belonging to a single arcane, divine, or psi skill.\nGeneric MR option: You grant the targets generic magic resistance equal to your skill level.\nBacklash option: Anyone who casts a spell or uses a power that can be affected by the Antimagic power suffers a backlash that inflicts a loss of 2 PP.\nSpell turning option: You add spell turning to the protection. Casters who cast rays and targeted spells (but not area effects) against the resistance and fail will themselves become a target.\nSpell leeching option: Same as spell turning option, but instead of turning a spell against its caster, you absorb some of the spell''s power. If you are the target of a ray or targeted spell, and the spell fails, you gain half of the spell''s (total PP cost + PP boost) as temporary PP.'
