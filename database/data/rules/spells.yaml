    Target: '1 location or object plus one spell (+0)'
    Description: 'This spell creates a magical touch sensor at a location or on an object, and then sets up a second spell to be activated by the sensor. The second spell must be cast by you directly after the Trigger spell, it must be centered on the target, it must target an area or the triggering creature(s) or objects present during the casting, and it must not have a higher PP cost than half the Trigger''s PL.\nThe second spell will not activate nor start counting its duration until the triggering condition has been met. The spell will take effect after the triggering condition has been resolved, and it cannot be used to interrupt an ongoing action. If the triggered spell involves an attack roll, replace it with d20! + (PL of the Trigger).\nThe Trigger is invisible, but it can be detected and disabled as a magical trap of the appropriate PL.\nThe trigger can be based on anything perceived by the sensor (recognition of creatures, words, etc. are limited by the caster''s Knowledge and Linguistics skills), but it can potentially be fooled by invisibility and illusions.\nSpot: The sensor has normal vision and can make reactive Spot checks.\nListen: The sensor has normal hearing and can make reactive Listen checks.'
