    Range: 'Rch (+0)\nClose (+3; LoS)\nMedium (+6; LoS)'
    Duration: 'Special (+0)'
    Target: '1 living creature (+0)\n2 living creatures (+2)\n3-4 living creatures (+4)\n5-8 living creatures (+6)\n9-16 living creatures (+8)'
    Description: 'You afflict the targets with deafness, blindness, poison, and/or a debilitating disease (see variations).'
    Options: 'Disease option: Caster can choose one of the following diseases: Blinding sickness, Cackle fever, Filth fever, Mindfire, Red ache, Shakes, and Slimy doom. The disease strikes immediately, with no incubation period.\nPoison option [Poison]: You inflict the target with a horrible poison (see Affliction Poison).'
    Results: 'S - The target suffers the chosen effects for 1 round.\nES - The target suffers the chosen effects for the rest of the encounter.\nCS - The effect becomes permanent (does not apply to poison variation).\nF - The target avoids the effect.'
