gainst Ref each round. A successful attack causes 4d6 SP of damage. Creatures and objects of medium size or smaller are sucked into the spout and take 2d6 SP per round for 1d3 rounds (after which they are expelled).\nMaelstrom option: You create a deadly vortex in a body of water. The vortex has a 12 square radius and is 12 squares deep, and the body of water must be at least this size. Any creature or craft of large size or smaller suffers a +10 attack against Ref each round. If the attack succeeds, the target is sucked into the vortex. Once sucked inside, a target is battered for 4d6 SP per round for 2d4 rounds (after which it is expelled).'
