  -
    ID: 6
    Name: 'Animate Plants'
    Descriptors: '[Su, AoO]'
    Skills: 'Divine - Plants'
    AttackCheck: null
    ActionTime: '7+TPC AP'
    Implements: 'V (+0), Silent (+2)\nS (+0), Still (+2)'
    Cost: '1 PP'
    Range: 'Medium (+0; LoS)\nLong (+3; LoS)'
    Duration: 'Encounter (D; +0)\nOngoing (+4; 1 PP/h)\nPermanent (D; +8; 100 XP cost per PL)'
    Target: 'Plants in spherical spread; 8 sq radius (+0)'
    Description: 'The basic spell animates all normal plants in the area of effect, creating difficult terrain and causing the plants to entangle all creatures that enter the area.'
    Options: 'Spike growth option: Instead of animating the plants in the area, you turn them into a mass of hard and sharp spikes. Their appearance does not change, but they cause 1d4 HP of damage for every square that a creature moves on foot through the area. Furthermore, if a +10 attack roll succeeds against a creature injured by the spikes, its movement is halved for 24 h (as per caltrop wounds).\nFull mobility option: You give full mobility and attack ability to a maximum of eight large plants in the area. A huge plant counts as two large, a gargantuan plant as four large, and a colossal plant as eight large. See animated objects in the creature chapter for details.\nLiveoak option: You transform any Huge tree in the area into a treant-like creature (see the creature chapter) that defends you and obeys your spoken commands.\nChangestaff option: Same as the liveoak option, but this instead transforms any wooden staff (or small tree).\nShambler option: You transform some of the undergrowth into 1d4+2 shambling mounds that defend you and obey your spoken commands.'
    Results: null
    Modifiers: null
    APBoost: null
    Frequency: null
