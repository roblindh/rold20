    Name: 'Force Barrier'
    Descriptors: null
    Skills: null
    Cost: '7 PP'
    Description: 'This variation creates a force field of the chosen shape. Unless otherwise specified, the field is immobile and invisible. The field is extremely durable, with a DR of 30 and 20 HP per PL, but it can be bypassed with teleportation effects or dispelled, and gaze attacks can pass through it.\nThe force field can be created so that it intersects with solid, non-living matter, but it cannot be created within living creatures nor be used to injure them.\nThe barred cage consists of 1-cm wide bands and 1-cm wide gaps. Attacks through such a cage are only possible if they can pass through gaps of that size.'
  -
    ID: 138
    SpellID: 100
    Name: 'Telekinetic Field'
    Descriptors: null
    Skills: null
    Cost: '15 PP'
    Description: 'Same as the force barrier variation, but if the creatures and objects enclosed in the force field weigh 2500 kg or less, you can concentrate to move the field and its contents up to 6 squares per round (in any direction but only within the chosen range). If you cease concentrating when the field is unsupported, it falls at a slow rate of 12 squares per round.'
  -
    ID: 139
    SpellID: 102
    Name: 'Pushing Hand'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'Once per round, the hand can make a bull rush attack (+15 vs. DeC) against the target.'
  -
    ID: 140
    SpellID: 102
    Name: 'Grappling Hand'
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: 'Once per round, the hand can initiate a grapple (+22 vs. DeC) or make a grapple attack (+27 attack; no damage).'
  -
    ID: 141
    SpellID: 102
    Name: 'Striking Fist'
    Descriptors: null
    Skills: null
    Cost: '+6 PP'
    Description: 'Once per round, the hand can strike the opponent with a melee attack (+28 vs. DeC; 2d6 + 11 HP blunt damage; +20 attack vs. Fort to stun for 1 round).'
  -
    ID: 142
    SpellID: 102
    Name: 'Crushing Hand'
    Descriptors: null
    Skills: null
    Cost: '+8 PP'
    Description: 'Once per round, the hand can initiate a grapple (+32 vs. DeC) or make a grapple attack (+37 attack; 3d6 + 12 HP blunt damage).'
  -
    ID: 143
    SpellID: 103
    Name: 'Danger Sense'
    Descriptors: null
    Skills: null
    Cost: '+4 PP\n+8 PP for improved'
    Description: 'The target gains +6 enhancement bonus in the Danger Sense skill.\nImproved danger sense: The target cannot be surprised or flat-footed, and the bonus in Danger Sense increases from +6 to +12.'
  -
    ID: 144
    SpellID: 108
    Name: Silence
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'You deaden sounds in the area of effect, providing a -10 circumstance penalty on listen checks. Sonic attacks are not affected, but creatures in the area receive a +4 circumstance bonus against language-dependent attacks. Action checks with a verbal component suffer a -4 circumstance penalty.'
  -
    ID: 145
    SpellID: 108
    Name: 'Sound Sculpting'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: "You change a certain type of sound into a different sound. For example, you can change the sound of the wind into singing, or you can change all voices in the area into barking. If this affects someone's voice, action checks with a verbal component suffer a -4 penalty."
  -
    ID: 146
    SpellID: 109
    Name: 'Greater Glyph'
    Descriptors: null
    Skills: null
    Cost: '+6 PP'
    Description: 'The glyph makes a +10 attack and deals 12d6 HP of damage (instead of +5 and 6d6).'
  -
    ID: 147
    SpellID: 109
    Name: 'Affliction Glyph'
    Descriptors: '[Necrotic]'
    Skills: 'Arcane - Necromancy\nDivine - Death'
    Cost: '+6 PP for pain glyph\n+10 PP for weakness glyph\n+12 PP for death glyph'
    Description: 'Pain glyph: If a +10 attack against Fort succeeds, creatures within a 12 square radius burst suffer wracking pains for 1 hour. This imposes a -4 penalty on all action checks.\nWeakness glyph: If a +12 attack against Fort succeeds, creatures within a 12 square radius burst suffer 3d6 points of Strength damage.\nDeath glyph: If a +12 attack against Fort succeeds, creatures within a 12 square radius die.'
  -
    ID: 148
    SpellID: 109
    Name: 'Mind Glyph'
    Descriptors: '[Mind]'
    Skills: 'Arcane - Enchantment\nDivine - Charm'
    Cost: '+6 PP for sleep glyph\n+8 PP for fear glyph\n+8 PP for persuasion glyph\n+10 PP for stun glyph\n+12 PP for insanity glyph'
    Description: 'Sleep glyph ([Sleep]): If a +10 attack against Will succeeds, creatures within a 12 square radius burst fall into a catatonic slumber for 3d6×10 minutes.\nFear glyph ([Fear]): If a +10 attack against Will succeeds, creatures within a 12 square radius burst become panicked for 1 round per skill level.\nPersuasion glyph ([Charm]): If a +10 attack against Will succeeds, creatures within a 12 square radius burst become charmed by the caster for 1 hour per skill level.\nStun glyph: If a +12 attack against Will succeeds, creatures within a 12 square radius burst become stunned for 1d6 rounds.\nInsanity glyph: If a +12 attack against Will succeeds, creatures within a 12 square radius become permanently insane.'
  -
    ID: 149
    SpellID: 110
    Name: Revivify
    Descriptors: null
    Skills: null
    Cost: '+6 PP'
    Description: "If the target died due to HP damage during the previous two rounds, the healing still takes effect (potentially saving the target's life)."
  -
    ID: 150
    SpellID: 110
    Name: Regeneration
    Descriptors: null
    Skills: null
    Cost: '+14 PP'
    Description: 'You restore missing body parts (limbs, eyes, ears, etc), destroyed organs, and crushed bones. This regeneration takes 2d10 rounds after completion of the spell.'
  -
    ID: 151
    SpellID: 116
    Name: Blinding
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: "The glow makes a +PL attack against the target's Ref (S - The target is blinded for 1 round; ES - Target is blinded for the rest of the encounter)."
  -
    ID: 152
    SpellID: 117
    Name: 'Improved Illusion'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'The illusion can also include simple sounds (but not speech).'
  -
    ID: 153
    SpellID: 117
    Name: 'Major Illusion'
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: 'The illusion can also include sound, smell, and temperature components. Speech with multiple voices (and other vocal sounds) is possible.'
  -
    ID: 154
    SpellID: 118
    Name: Mask
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'Instead of disguising the targets, you cover their faces with shadowy masks. The mask conceals their appearance but does not impede vision. It also provides a +4 circumstance bonus to defenses against blinding attacks and gaze attacks.'
  -
    ID: 155
    SpellID: 118
    Name: 'Full Illusion'
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: 'The illusion is not only visual, but also includes sound, smell, and touch.'
  -
    ID: 156
    SpellID: 119
    Name: Mislead
    Descriptors: null
    Skills: null
    Cost: '+8 PP'
    Description: 'You make yourself invisible (see Invisibility spell) while creating a single illusory duplicate in your space. You can direct the duplicate to move anywhere within line of sight (with your own base speed and movement abilities). The duplicate is immune to all attacks.'
  -
    ID: 157
    SpellID: 119
    Name: Projection
    Descriptors: null
    Skills: null
    Cost: '+10 PP'
    Description: 'You create a single quasi-real duplicate of yourself within 40 squares. It looks, sounds, and smells like you but is intangible and immune to attacks. The duplicate mimics your actions (and speech) every round, unless you spend 5 AP to mentally direct it to act differently. Your MP can be spent either on yourself or on moving the duplicate (or a mix of both). You can choose to see and hear through the duplicate''s senses, and you can switch your perception back and forth at no cost. You can cast your spells and use other supernatural powers through the projection, causing them to originate from (and even affect) the duplicate. If you are holding a melee weapon, the duplicate appears threatening enough to provide flanking bonuses.\nIf the distance between you and the duplicate exceeds 40 squares, or if you lose line of effect, the duplicate disappears instantly, and the spell ends.'
  -
    ID: 158
    SpellID: 120
    Name: 'Illusory Construction'
    Descriptors: null
    Skills: null
    Cost: '+2 PP per 2x2 sq wall\n+4 PP for illusory construction'
    Description: 'The wall variation lets you augment your illusion with a visual illusion of natural or constructed walls, floors, and/or ceilings. Such illusions can also be used to hide real doors, pits, and openings.\nIllusory Building: You can also hide or change any buildings and other constructions in the area.'
  -
    ID: 159
    SpellID: 122
    Name: Flensing
    Descriptors: null
    Skills: null
    Cost: '+8 PP'
    Description: 'In addition to dealing damage, a successful attack also causes 1d6 points of ability damage to Con and Cha.'
  -
    ID: 160
    SpellID: 123
    Name: Stun
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'Instead of confusing the target, you stun it. A stunned creature can take no actions.'
  -
    ID: 161
    SpellID: 123
    Name: Feeblemind
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: 'Instead of confusing the target, you reduce its Int and Cha to 1. It can still move and attack with weapons, but it cannot cast spells, communicate, or perform most skills.\nThis variation is particularly potent against arcane casters; the attack gains a +2 bonus per Arcane Affinity skill that the target has at least 1 level in.'
  -
    ID: 162
    SpellID: 124
    Name: 'True Invisibility'
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: 'You make the target (and its equipment) invisible to normal sight as well as darkvision, in other words giving it total concealment. If the target makes an attack, the spell ends (just as for the basic spell).'
  -
    ID: 163
    SpellID: 124
    Name: 'Invisibility Sphere'
    Descriptors: null
    Skills: null
    Cost: '+6 PP'
    Description: 'Each target emanates an invisibility sphere of 2 square radius. All creatures within that volume at the time of casting also become invisible, and they remain invisible for as long as they stay within the emanation. Creatures within the emanation can see each other, but creatures entering it after the casting do not become invisible, nor can they see the invisible creatures. If any invisible creature makes an attack, the effect ends for each and every emanation affecting that creature.'
  -
    ID: 164
    SpellID: 124
    Name: 'Greater Invisibility'
    Descriptors: null
    Skills: null
    Cost: '+6 PP'
    Description: 'Same as true invisibility, but the invisibility is not terminated by attacks made by the subject(s).'
  -
    ID: 165
    SpellID: 125
    Name: 'Greater Lore'
    Descriptors: null
    Skills: null
    Cost: '+10 PP\n+14 PP for vision'
    Description: 'You magically bring to mind legends about an important person, place, or object. The more information about the subject you start with and the better your spellcasting check, the more detailed the results of this spell. Normal success typically reveals the target''s name, race or type, class, and alignment. Outstanding success also reveals approximate power and current location. Any greater level of success reveals actions taken and locations visited by the target during the previous 8 hours.\nVision: Same as above, but in addition to the normal results, you may receive a vision about the person, place, or object. This can be a current view or a particularly important vision from its history.'
  -
    ID: 166
    SpellID: 126
    Name: 'Water Walk'
    Descriptors: null
    Skills: null
    Cost: '+1 PP'
    Description: 'By hovering 1 to 2 cm over the ground, you can move across any surface (including water, mud, snow, ice, and even lava) as if it were solid ground. You also become harder to track (-10 penalty). If the target is submerged in a liquid, this effect will carry it towards the surface at a rate of 12 sq per round.'
  -
    ID: 167
    SpellID: 126
    Name: 'True Levitate'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'The targeted creature can levitate up or down with a base speed of 4. It cannot move horizontally, unless it is able to push against a wall or ceiling (at half normal speed).'
  -
    ID: 168
    SpellID: 126
    Name: 'True Flight'
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: 'The targeted creature can fly freely in any direction. You can choose either a base flying speed of 6 and good maneuverability or a base speed of 8 and average maneuverability.'
  -
    ID: 169
    SpellID: 127
    Name: Free-Floating
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'Instead of causing an object to glow, you cause the air itself to glow. You can cause the light to move in any direction up to 20 squares per round.'
  -
    ID: 170
    SpellID: 127
    Name: Shapeable
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'The shape and direction of the glow can be controlled each round. For example, you can turn the light into a cone (like a bullseye lantern) or shape the glow itself into a vaguely humanoid figure.'
  -
    ID: 171
    SpellID: 127
    Name: Daylight
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: 'The brightness is equal to full daylight (bright light) within 8 squares, normal light within 16 squares, and dim light within 24 squares.'
  -
    ID: 172
    SpellID: 128
    Name: 'Speak with Dead'
    Descriptors: '[Mind]'
    Skills: 'Arcane - Enchantment\nDivine - Charm'
    Cost: '+4 PP'
    Description: 'Instead of preserving the corpse, you try to read its memories. If you make an attack that beats the target''s Will (that the creature had when alive), you can effectively "ask" the corpse one simple question per two skill levels. Note that this spell only accesses the knowledge and memories of the corpse, not its soul or personality. The duration of this effect is just one encounter, and each corpse can only be subjected to this spell variation once.'
  -
    ID: 173
    SpellID: 132
    Name: 'Time Stop'
    Descriptors: null
    Skills: null
    Cost: '17 PP'
    Description: 'This variation actually stops the flow of time for everyone except the target creatures, letting them immediately spend 5d10 AP without interference. The affected creatures can move, but they are unable to affect creatures and objects that are still frozen in time.'
  -
    ID: 174
    SpellID: 133
    Name: 'Illusory Script'
    Descriptors: null
    Skills: 'Arcane - Illusion'
    Cost: '+4 PP'
    Description: 'You hide the actual writing behind an illusion of either unintelligible text or something else entirely. Only you and people designated by you at the time of casting can read the true text. If you spend an additional 2 PP, a successful dispelling of the illusion will also cause the real text to be erased.'
  -
    ID: 175
    SpellID: 133
    Name: 'Suggestive Script'
    Descriptors: null
    Skills: 'Arcane - Enchantment'
    Cost: '+4 PP'
    Description: "You embed a suggestion (e.g. close the book and leave, forget the book's existence, etc) in the text. Make a +PL attack against the reader's Will (S - target obeys the suggestion for 30 minutes)."
  -
    ID: 176
    SpellID: 134
    Name: 'Stone Meld'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'Instead of melding with a plant, you meld with a mass of natural stone.'
  -
    ID: 177
    SpellID: 134
    Name: 'Nature Stride'
    Descriptors: '[Teleport]'
    Skills: null
    Cost: '+6 PP\n+8 PP for greater stride'
    Description: 'After melding with nature, you can teleport to a similar plant or mass of stone within 400 squares (or 600 m). This action costs 5 AP and can be done once per round.\nGreater stride: Same as above, but you can teleport to any similar plant or stone on the same plane. When you do this, however, the spell ends automatically.'
  -
    ID: 178
    SpellID: 135
    Name: Stasis
    Descriptors: null
    Skills: null
    Cost: '+8 PP'
    Description: 'You enter a trance so deep that even magic cannot detect that you are alive. However, you remain fully aware of your surroundings, and you can dismiss the trance at any time (although this takes 4 rounds). Your metabolism is almost nonexistent, and one year of stasis equals a single day for the purpose of aging, hunger, thirst, and breathing.'
  -
    ID: 179
    SpellID: 135
    Name: Regeneration
    Descriptors: null
    Skills: null
    Cost: '+12 PP'
    Description: 'You briefly increase your rate of metabolism, gaining regeneration (10 HP/SP per round) for 20 minutes.'
  -
    ID: 180
    SpellID: 136
    Name: 'Mental Fortitude'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'In addition to the improved Will defense, the spell halves psychic damage and any other damage to health points and ability scores suffered from mind-affecting spells.'
  -
    ID: 181
    SpellID: 136
    Name: 'Mental Fortress'
    Descriptors: null
    Skills: null
    Cost: '+6 PP'
    Description: "Any mind-affecting spell or effect attempted against the target has to beat your spell's PL. The same applies to all attempts to magically locate or detect the target."
  -
    ID: 182
    SpellID: 137
    Name: 'Surface Read'
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: 'By reading the surface thoughts of the target creatures, you gain a +10 enhancement bonus on Psychology-based skill checks against them.'
  -
    ID: 183
    SpellID: 137
    Name: 'Probe Memory'
    Descriptors: null
    Skills: null
    Cost: '+6 PP'
    Description: "You can reach into a target's mind and examine its memories. Discovering a single piece of information takes a full round, and perusing the memory of an event takes half the time of the actual event. Each successful attack lets you probe one memory."
  -
    ID: 184
    SpellID: 137
    Name: 'Skill Leech'
    Descriptors: null
    Skills: null
    Cost: '+8 PP'
    Description: 'You "borrow" a single skill (caster''s choice) from the target. For the duration of the spell, you effectively have as many skill ranks in that skill as the target.'
  -
    ID: 185
    SpellID: 148
    Name: 'Flame Blade'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'The flame extends 1 m from your hand, increasing the fire damage to 1d10 HP and counting as a small-sized object (use Weapons - Natural or Weapons - Heavy Blades for bonuses).'
  -
    ID: 186
    SpellID: 149
    Name: Anti-Detection
    Descriptors: null
    Skills: null
    Cost: '+2 PP\n+4 PP for improved'
    Description: 'The spell also protects the target against any divination effect that detects auras. Any such attempt has to beat your spell''s PL or reveal nothing.\nImproved: The spell protects against all divination effects, not just aura detection.'
  -
    ID: 187
    SpellID: 149
    Name: 'False Aura'
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: "Instead of preventing the target's aura from being detected, you hide it behind a false aura. You can choose the specifics of the false aura, including alignment, magic, life force, etc."
  -
    ID: 188
    SpellID: 150
    Name: 'Detect Scrying'
    Descriptors: '[Scry]'
    Skills: null
    Cost: '+2 PP'
    Description: "You automatically detect any scrying against the target or within the area. If your spell's PL beats the spellcasting check of the scryer, you get a visual image of the scryer as well as his approximate direction and distance."
  -
    ID: 189
    SpellID: 150
    Name: Privacy
    Descriptors: null
    Skills: null
    Cost: '+6 PP'
    Description: 'The target area is also protected against direct observers and eavesdroppers. Anyone watching from outside sees only a foggy mass, and no sounds can escape from the inside to the outside. Those inside can see and hear normally.'
  -
    ID: 190
    SpellID: 150
    Name: 'False Vision'
    Descriptors: null
    Skills: 'Arcane - Illusion'
    Cost: '+6 PP'
    Description: "You create a false image that will be seen (and heard) by any scryers unable to beat your spell's PL. You can concentrate to change the image at any time, but it otherwise remains static. If you combine this variation with the privacy variation, the same illusion can be presented to direct observers (instead of the fog)."
  -
    ID: 191
    SpellID: 150
    Name: Backlash
    Descriptors: null
    Skills: null
    Cost: '+8 PP'
    Description: "Scryers who fail to beat the spell's PL also take 8d6 PP of damage."
  -
    ID: 192
    SpellID: 151
    Name: 'Memory Drain'
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: 'Instead of altering specific memories, you remove the benefits of recent experiences from the target creature. It effectively loses two levels.'
  -
    ID: 193
    SpellID: 151
    Name: 'Delete Skill'
    Descriptors: null
    Skills: null
    Cost: '+8 PP'
    Description: 'You can actually make the target forget a single skill, effectively reducing the level in that skill to 0. The only way to regain the skill is to relearn it or to use this spell again to undo the damage.'
  -
    ID: 194
    SpellID: 151
    Name: Restoration
    Descriptors: null
    Skills: null
    Cost: '+8 PP'
    Description: 'You cure the target of any mental illness, including mind-affecting spells and powers. This can also restore memories and skills lost to this spell or other instantaneous effects. You can also choose to restore all ability damage to mental ability scores and any negative levels the target is suffering from.'
  -
    ID: 195
    SpellID: 154
    Name: Fabricate
    Descriptors: null
    Skills: null
    Cost: '+8 PP'
    Description: 'You convert raw materials into a finished product. For example, you can turn trees into a bridge, hemp into a rope, wool into clothes, etc.'
  -
    ID: 196
    SpellID: 156
    Name: Protection
    Descriptors: null
    Skills: null
    Cost: '+4 PP'
    Description: 'Targets also receive DR +5 vs non-magical weapons and a +3 resistance bonus on Fort, Ref, and Will defenses.'
  -
    ID: 197
    SpellID: 157
    Name: Transmutation
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'You also transmute the object to a cloth-like substance, and this will effectively suspend time for the object. For example, this application could be used on a burning torch or a bucket of water. If the cloth-like object is thrown against a solid surface, the spell ends, and the object reverts to normal.'
  -
    ID: 198
    SpellID: 160
    Name: Repulsion
    Descriptors: null
    Skills: null
    Cost: '+10 PP'
    Description: 'In addition to being protected against attacks, the target creature emanates a field that prevents hostile creatures from approaching. The field does not push creatures away, but it prevents affected attackers from moving closer to the target. The caster can set the radius of the emanation from 2 squares to 30 squares.'
  -
    ID: 199
    SpellID: 161
    Name: 'Scrying Pool'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'Instead of personally receiving the information from the sensor, you show it on a display of some sort (pool of water, crystal ball, mirror, et al). This means you can show it to others.'
  -
    ID: 200
    SpellID: 161
    Name: 'Mobile Sensor'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'The sensor(s) can be moved at a rate of 6 squares per round. The sensor can pass through openings as small as 3 cm diameter. It cannot pass beyond the chosen range.'
  -
    ID: 201
    SpellID: 161
    Name: 'Multiple Sensors'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'You create up to 10 separate sensors within range.'
  -
    ID: 202
    SpellID: 161
    Name: 'Smart Sensor'
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'You can give the sensor(s) simple commands, and it can alert you with a mental "ping". For example, you can use a mobile sensor to search for a certain object or individual, or you can use multiple sensors to set up a perimeter and watch for dangerous creatures.'
  -
    ID: 203
    SpellID: 162
    Name: Lodge
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: 'You create a small (2x2 squares) cottage or lodge inside the sphere of force. It can be made to look like a stone, timber, or even sod dwelling, but it always has the strength of a stone building. The lodge has a sturdy door (with a lock), two barred windows, a fireplace (the chimney is protected by a grate), 8 bunks, a table, 8 tools, and a writing desk.'
  -
    ID: 204
    SpellID: 164
    Name: Simulacrum
    Descriptors: null
    Skills: null
    Cost: '+2 PP'
    Description: "Instead of choosing a certain creature type, you create a quasi-real duplicate of another creature within the spell's range. You must pay the full PP cost, based on the original's CL. The caster should make a Disguise check to determine how good the likeness is."
  -
    ID: 205
    SpellID: 164
    Name: 'Shadow Mount'
    Descriptors: null
    Skills: null
    Cost: '3 PP\n+4 PP for levitating\n+8 PP for flying'
    Description: 'Instead of a "normal" creature, you conjure a horselike mount of Large size. It is black and gray, somewhat insubstantial, and completely soundless. It comes equipped with saddle, bit, and bridle, and it carries up to 100 kg plus 5 kg per skill level. It makes no attacks, but most normal animals shun it and refuse to attack it.\nShadow mount (DeC 14; DR 4; HP 7 + skill level; Spd 3 x skill level)\nLevitating mount: Same as above, but the creature can move across sand, mud, swamps, water, and other liquid or semiliquid surfaces without difficulty.\nFlying mount: Same as above, but the mount can fly at base speed with average maneuverability.'
  -
    ID: 206
    SpellID: 164
    Name: 'Shadow Hound'
    Descriptors: null
    Skills: null
    Cost: '7 PP'
    Description: 'Instead of a "normal" creature, you conjure a shadow watchdog that guards you and attacks your enemies. It is invisible to everyone but yourself, and it can both detect and attack invisible and ethereal creatures. It barks when any intruder comes within 6 squares and attacks as directed by you.\nShadow Watchdog (DeC 16; HP 20 + skill level; +10 attack - 2d6+3 HP piercing; invisible)'
  -
    ID: 207
    SpellID: 166
    Name: 'Water Breathing'
    Descriptors: null
    Skills: null
    Cost: '1 PP'
    Description: 'This variation alters the target(s) so that they can breathe both air and water.'
  -
    ID: 208
    SpellID: 166
    Name: 'Plant Form'
    Descriptors: null
