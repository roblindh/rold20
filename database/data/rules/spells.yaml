    Options: 'Anti-vermin option: The barrier also keeps out vermin (small mammals, insects, arachnids, etc).\nAnti-animal option: Like anti-vermin, but the barrier also keeps out animals, monstrous animals, and vermin.\nAnti-life option: Like anti-animal, but the barrier also keeps out aberrations, dragons, humanoids, and monstrous humanoids (but not outsiders, elementals, constructs, and undead).'
