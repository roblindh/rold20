    Options: 'Grade I option: You can perform a single grade I shapechange of the target(s).\nGrade II option: You can perform a single grade II shapechange of the target(s).\nGrade III option: You can perform a single grade III shapechange of the target(s).\nGrade IV option: You can perform a single grade IV shapechange of the target(s).\nPlant form option: You can turn the target(s) into plants of Large size (shrubs or trees). A creature in plant form has its normal HP, a natural DR of 4, +10 critical hit resistance, and is immobile (Dex and speed 0) but can still see, hear, and smell normally.\nGaseous form option: You can turn the target(s) into gaseous form.\nStatue form option: You can turn the target(s) into solid stone statues. A creature in statue form has its normal HP, a natural DR of 8, +20 critical hit resistance, and is immobile (Dex and speed 0) but can still see, hear, and smell normally. If the creature normally consists of flesh, its mass triples.\nMultiple uses options: The target(s) can perform multiple shapechanges. Each change requires just 2 AP.\nMental change option: If you are making a grade II or III shapechange and succeed on a (d20 + Body & Mind skill mod + MAM + AB + Wis mod vs. Will) check, the target''s mental ability scores, alignment, and personality will also change.\nOak body option: The target gains a natural DR of 5 and becomes immune to ability damage, blindness, deafness, disease, drowning, poison, stunning, and other similar effects. It also takes only 1/2 damage from cold but becomes vulnerable to fire. It gains a +4 enhancement bonus to Str but take a -2 enhancement penalty to Dex. The target does not (and actually can''t) breathe, eat, or drink, but it can still speak.\nStone body option: Same as statue form option, but the target can still move and act. However, its base speed is halved, and it suffers a natural encumbrance class of 8. It gains immunity to blindness, deafness, ability damage, disease, poison, and stunning. It takes 1/4 damage from cold and 1/2 damage from fire and electricity. It does not need to (and actually can''t) breathe, drink, or eat. The creature gains a +4 enhancement bonus to Str but suffers a -4 penalty to Dex (to a minimum of 1). Finally, damage caused by its natural weapons increases by two steps.\nForm of doom option: You turn the target(s) into nightmarish versions of themselves, with writhing tentacles growing from their backs. The targets gain the frightful presence ability, a +5 natural DR bonus, +4 bonus to Str, and a +1 bonus to speed. Four of the tentacles are large enough to make melee attacks within normal reach, with a base damage of 2d8 HP.\nIron body option: Same as stone body option, but the target''s body turns into iron. It gains a natural DR of 10, enjoys a +6 enhancement bonus to Str, but suffers a -6 penalty to Dex and a natural encumbrance class of 10. A creature of iron weighs 8 times as much as one of flesh.\nShadow body option ([Necrotic]): You turn the target into an insubstantial shadow (+15 to Hide checks in dim light or darkness). It has its normal speed but can move across any surface, including walls and ceilings. It cannot attack physically or manipulate physical objects, but it can still cast spells and use mental powers. It gains a natural DR of 10, +20 critical hit resistance, and darkvision, and it gains immunity to ability damage, disease, drowning, and poison. It takes only 1/2 damage from acid, electricity, and fire.'
