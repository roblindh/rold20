  -
    ID: 18
    Name: Binding
    Descriptors: '[Su, MR, AoO, Mind]'
    Skills: 'Arcane - Enchantment'
    AttackCheck: '(Rch: d20! + Dex mod + Weapons - Natural skill + MAM + others mods vs. DeC and then)\nd20! + Cha mod + Body & Mind skill + MAM + other mods vs. Will'
    ActionTime: '1 min (+0)\n1 r (+4)\n7+TPC AP (+8)'
    Implements: 'V (+0), Silent (+2)\nS (+0), Still (+2)\nM (gems worth 500+ sp per target''s TL; only for creatures and for duration longer than an encounter)'
    Cost: '9 PP'
    Range: 'Rch (+0)\nClose (+3; LoS)'
    Duration: 'Encounter (D; +0)\n1 year (D; +6)\nPermanent (D; +8)'
    Target: '1 creature or object (+0)'
    Description: 'This spell creates a magical restraint to bind and/or hide the target creature or object.\nYou can specify any number of triggering conditions that can end the spell prematurely and release the target. If the DM deems the conditions reasonable, they provide a bonus to the attack check.\nThe following binding types can be chosen:\n- Chaining (req Arcane - Transmutation): The target is immobilized and confined in magical chains. The chains generate an Antipathy effect that affects all creatures other than the caster.\n- Slumber: The target becomes comatose and does not age nor need to eat, drink, or breathe for the duration.\n- Bound Slumber (req Arcane - Transmutation): A combination of Chaining and Slumber.\n- Imprisonment (req Arcane - Ouranomancy): Same as Slumber, but the target is also imprisoned far beneath the surface of the earth.\n- Hedged Prison (req Arcane - Ouranomancy): The target is transported to a confined area (e.g. a labyrinth) from which it cannot escape.\n- Metamorphosis (req Arcane - Transmutation): The target''s body (but not head) assumes a gaseous form, and the target is bound within a magical container. The target remains aware and can still speak, but it is unable to escape, attack, cast spells, and use other skills and abilities. It does not age nor require food, drink, and air for the duration. Breaking the container ends the spell.\n- Minimus Containment: The target is shrunk to a size of 2 to 3 cm and bound within a magical container. It does not age nor require food, drink, and air for the duration. Breaking the container ends the spell.'
    Options: 'Sequester option (req Arcane - Illusion): The target is also rendered invisible, and attempts to scry on or magically locate the target have to beat your spellcasting check.\nTrigger gem option: For this option, the material component has to be a single gem (instead of several). The spell is stored inside the gem and does not take effect until the intended target touches or picks up the gem.'
    Results: 'S - The target is helpless for 1 round while fighting off the spell.\nES - You successfully bind the target.\nF - You fail to bind the target.'
    Modifiers: 'Each reasonable termination trigger: +2 (maximum +6)\nTarget''s name known: +2\nTarget''s background history known: +2\nUsing a statuette of the target as focus: +2\nSlumber binding: -1\nBound Slumber binding: -2\nImprisonment binding: -2\nHedged Prison binding: -3\nMetamorphosis binding: -4\nMinimus Containment binding: -4\nTrigger gem: +10'
    APBoost: '+1 attack bonus per AP'
    Frequency: null
  -
    ID: 19
    Name: 'Blade Barrier'
    Descriptors: '[Su, MR, AoO, Force]'
    Skills: 'Arcane - Abjuration and Kinetomancy\nDivine - Protection\nPsi - Psychokinesis'
    AttackCheck: 'd20! + 5 vs. DeC (for force weapon)\nd20! + 10 vs. Ref (for the Wall of Blades variation)'
    ActionTime: '7+TPC AP'
    Implements: 'V (+0), Silent (+2)\nS (+0), Still (+2)'
    Cost: '1 PP\n+2 PP per +1 attack or parry (up to +5)\n+1 PP per +1 damage (up to +10)\n+2 PP for additional d8 HP radiant damage [Radiant]'
    Range: 'Medium (+0; PoE)'
    Duration: 'Encounter (D; +0)\nOngoing (+4; 1 PP/h)\nPermanent (D; +8; 100 XP cost per PL)'
    Target: 'One force shield (+0)\nOne force weapon (+2)'
    Description: 'With the single shield "area", you create a shield of pure force. It provides you with a +2 parry bonus to DeC, and it also works against ethereal and incorporeal attacks.\nWith the single weapon "area", you create a weapon of pure force and direct it against one opponent within range. The weapon automatically makes one attack per round (starting on the round it is created), successful hits dealing 2d8 S HP or B SP of damage. The weapon can be redirected to a new opponent by spending 5 AP.\nBy spending more PP, you can increase the damage caused by the force weapon(s).'
    Options: 'Radiant weapon option [Radiant]: Infuses the weapon(s) with radiant energy, doubling damage against undead.\nAnti-force weapon option: If the weapon strikes a [Force] effect of lower PL, that effect is dispelled.'
    Results: 'Force weapon:\nS - The target takes the specified amount of damage.\nCS - The target takes double damage.\nF - The weapon misses.\nWall of Blades variation:\nS - The target takes 1d6 per 2 skill levels HP of slashing damage.\nCS - The target takes double damage.\nF - The target takes half damage.\nCF - The target avoids all damage.'
    Modifiers: null
    APBoost: null
    Frequency: null
