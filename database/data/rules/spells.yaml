    Description: 'You mark any object or surface with your personal rune or mark (up to six separate characters). The mark can be no larger than 30x30 cm. On a living creature, the mark disappears after roughly one month.\nBy paying the additional cost, you can make the mark invisible (but still visible to anyone able to detect magic or invisibility).'
    Options: 'Invisible option: The mark is invisible, but can be seen by anyone able to detect magic or invisibility.\nLocation option (req Arcane - Divination): As long as you are in the same plane, you can sense the approximate direction and distance to the mark.\nSecret chest option (req Arcane - Conjuration and Ouranomancy; [Dimension]): You mark a special chest (constructed of expensive materials and worth at least 500 gp) that you can repeatedly hide on the Ethereal Plane and summon to your present location at will (5 AP cost). Regardless of the chest''s actual size, it can contain 30 litres per skill level.\nSummoning option (req Arcane - Conjuration; [Teleport]): If the mark is placed on an object weighing no more than 5 kg, you can summon it to your current location at any time (5 AP cost). If the object is held or carried by another creature, you have to make a spellcasting check against that creature''s Will.'
