  -
    ID: 2
    CurrentSP: 'Half+1 to full SP'
    Description: 'The creature is slightly fatigued but suffers no special penalties.'
  -
    ID: 3
    CurrentSP: '1 to half SP'
    Description: 'Fatigued: The creature is seriously fatigued. Many physical actions suffer a -2 penalty (see PAM).'
  -
    ID: 4
    CurrentSP: 0
    Description: 'Exhausted: The creature is near collapse. It can only use half its AP/MP each round, and further SP costs are converted to HP damage on a point-for-point basis. Each such SP cost or loss requires a Fortitude defense to avoid falling unconscious (d20! + SP cost vs. Fort). Many physical actions suffer a -6 penalty (PAM).'
ppeffects:
  -
    ID: 1
    CurrentPP: 'Full PP'
    Description: 'The creature is in full mental vigor.'
  -
    ID: 2
    CurrentPP: 'Half+1 to full PP'
    Description: 'The creature is slightly tired but suffers no special penalties.'
  -
    ID: 3
    CurrentPP: '1 to half PP'
    Description: 'Tired: The creature is very tired. Many mental actions suffer a -2 penalty (see MAM).'
  -
    ID: 4
    CurrentPP: 0
    Description: 'Drained: The creature is mentally drained and near collapse. It can only use half its AP/MP each round, and further PP costs are converted to HP damage on a point-for-point basis. Each such PP cost or loss requires a Will defense to avoid falling unconscious (d20! + PP cost vs. Will). Many mental actions suffer a -6 penalty (MAM).'
implementtypes:
  -
    ID: 1
    Name: Concentration
    ShortName: C
    Description: 'You need a certain amount of focus and concentration to perform the action.\nIf you perform the action while you are already maintaining concentration on another action, you lose the earlier action.'
  -
    ID: 2
    Name: Verbal
    ShortName: V
    Description: 'You need to be able to speak in a firm voice. Typically, you have to use a language, but the targets (if any) do not need to understand the language. Creatures without true languages (such as animals) cannot perform actions that require a verbal component.\nIf you are deafened, you suffer a -4 circumstance penalty on the action check.'
  -
    ID: 3
    Name: Somatic
    ShortName: S
    Description: 'You need to be able to gesticulate clearly with one or more hands; at least one hand must be empty and free to move. However, some actions allow special foci to be used in place of hands; for example, wands can be used for arcane spellcasting and holy symbols for divine spellcasting.'
  -
    ID: 4
    Name: Material
    ShortName: M
    Description: "You need to use one or more consumables. The action's activation time assumes that the material is easy to reach (in a belt pouch, for instance, and not in a backpack). Otherwise, add the time required to find and retrieve the material."
  -
    ID: 5
    Name: Focus
    ShortName: F
    Description: 'You need a catalyst that is not consumed by the action. The action''s activation time assumes that the focus is easy to reach (in a belt pouch or around the neck, for instance, and not in a backpack).\nIf the exact type of focus is not specified, one can use any generic focus appropriate to the skill or skills used, such as a wand or staff for arcane spells, a holy symbol or rod for divine spells, a musical instrument for bardic music, etc.'
  -
    ID: 6
    Name: Vision
    ShortName: vis
    Description: 'You need eyes or an equivalent sense of vision. Vision-related modifiers may apply to the action.'
  -
    ID: 7
    Name: Hearing
    ShortName: aud
    Description: 'You need ears or an equivalent sense of hearing. Hearing-related modifiers may apply to the action.'
  -
    ID: 8
    Name: Touch
    ShortName: tch
    Description: 'You need a sense of touch.'
  -
    ID: 9
    Name: Smell
    ShortName: sml
    Description: 'You need a sense of smell.'
targettypes:
  -
    ID: 1
    Name: You
    ShortName: you
    Description: 'The action affects only you.'
  -
    ID: 2
    Name: Target
    ShortName: tgt
    Description: 'Specifies the number and types of creatures or objects that can be affected.\nYou typically need both line of sight and line of effect to each target (unless the range specifies otherwise). Selection of a target requires no aiming and no ranged attack roll, however, and the effect only has to overcome the defense and resistance of the target(s).\nSome actions can only affect willing targets, but unconscious creatures are automatically considered willing for such actions.'
  -
    ID: 3
    Name: Ray
    ShortName: ray
    Description: 'A ray is a ranged attack that can strike and affect a single creature or object.\nAll of the modifiers and conditions that apply to ranged weapon attacks also apply to ray attacks.\nA ray is always instantaneous, and any other duration specified is the duration of the effect (not of the ray itself).'
  -
    ID: 4
    Name: Burst
    ShortName: bst
    Description: 'The effect radiates the specified distance from the point of origin. It does not flow around corners, so a target''s cover is calculated relative to the point of origin.\nA burst is always instantaneous, and any other duration specified is the duration of the effect (not of the burst itself).'
  -
    ID: 5
    Name: Emanation
    ShortName: emn
    Description: 'The effect radiates the specified distance from the point of origin, just like a burst effect.\nEmanations, however, are generally non-instantaneous and last for the action''s specified duration.'
  -
    ID: 6
    Name: Spread
    ShortName: sprd
    Description: 'The effect spreads or flows out the specified distance from the point of origin. It can flow around corners, through openings, and into areas that you cannot see, but it does not penetrate solid obstructions.\nSpreads typically last for the action''s specified duration.'
  -
    ID: 7
    Name: Sphere
    ShortName: sph
    Description: 'A spherical volume with the point of origin at its center. Unless otherwise specified, the point of origin should be an intersection between squares.'
  -
    ID: 8
    Name: Cone
    ShortName: con
    Description: 'Has its apex at the point of origin and spreads in a 90 degree cone in any desired direction. Unless otherwise specified, the point of origin should be an intersection between squares.'
  -
    ID: 9
    Name: Cylinder
    ShortName: cyl
    Description: 'A cylinder-shaped volume with its center at the point of origin. Unless otherwise specified, the point of origin should be an intersection between squares. Many cylindrical volumes of effect have to be oriented with their circular surfaces parallel to the ground.'
  -
    ID: 10
    Name: Line
    ShortName: line
    Description: 'A narrow cylinder stretching away from the point of origin in any desired direction.\nLine-shaped effects affect all squares that the line passes through.'
  -
    ID: 11
    Name: Wall
    ShortName: wall
    Description: 'Wall areas are vertical planes of a specified material, shape, size, and thickness. Wall characteristics can vary widely, but unless otherwise specified, a wall is opaque and may not have curves or corners, and if its thickness is less than 1 square, it must be placed between squares (rather than through squares).\nCatching creatures "under" a wall area is usually quite hard, requiring an attack roll against Ref with exceptional success. Furthermore, many wall areas must be continuous and unbroken when formed, so creating them in a creature''s spacing would cause them to fail.'
costtypes:
  -
    ID: 1
    Name: Wealth
    ShortName: sp
    Description: 'The specified amount of coins or valuables has to be spent.'
  -
    ID: 2
    Name: Health
    ShortName: HP
    Description: 'The action requires a certain amount of blood or is otherwise injurious, measured as a HP cost.'
  -
    ID: 3
    Name: Fatigue
    ShortName: SP
    Description: 'The action is physically taxing and costs SP to perform.'
  -
    ID: 4
    Name: Power
    ShortName: PP
    Description: 'You become mentally fatigued when performing the action, expressed as a PP cost.'
  -
    ID: 5
    Name: Experience
    ShortName: XP
    Description: 'You have to spend a part of your soul and life energy to perform the action. This actually makes you forget a portion of your past life, and this in turn causes a reduction in XP (possibly even a reduction in level).\nAs a slightly less drastic alternative to spending your own XP, you can use residuum (pure life energy and magic in a liquid form). Life energy can also sometimes be drawn from permanent magical devices, from creatures other than yourself, and from some very rare and expensive material components.'
activitylevels:
  -
    ID: 1
    Name: 'Safe Rest'
    Description: 'Resting in a safe and comfortable environment. Professional care can improve recovery rates further.\nMost equipment and armor are typically stowed away.\n50% of time awake can be spent learning spells, doing research, performing work-related activities, etc.'
    RecoverHP: 2xTL/day
    RecoverSP: 2xTL/h
    RecoverPP: 2xTL/h
    RecoverAbil: 2/day
    OtherEffects: '-4 circumstance modifier to Perception-based actions (-10 modifier while sleeping)'
  -
    ID: 2
    Name: 'Low Activity (Relaxed)'
    Description: 'Non-strenuous work, or resting in a potentially unsafe or uncomfortable environment.\nHeavy equipment and armor are typically not worn.\n75% of time awake can be spent learning spells, research, crafting, etc.'
    RecoverHP: TL/day
    RecoverSP: TL/h
    RecoverPP: TL/h
    RecoverAbil: 1/day
    OtherEffects: '-2 circumstance modifier to Perception-based actions'
  -
    ID: 3
    Name: 'Medium Activity (Ready)'
    Description: 'Normal activity, such as walking in friendly or neutral territory, active guard duty, normal physical labor, etc.\nAll armor and equipment are usually worn/carried.'
    RecoverHP: TL/day
    RecoverSP: TL/h
    RecoverPP: TL/h
    RecoverAbil: 1/day
    OtherEffects: '-'
  -
    ID: 4
    Name: 'High Activity (Alert)'
    Description: 'Fatiguing or stressful activity, such as forced march, hard labor, combat, running, walking or sneaking through hostile territory, etc.\nAll armor and equipment are worn/carried.\nCreatures that perceive a possible threat will typically assume this level of activity, and they will often make preparations of encounter-level duration and perform active Spot and Listen checks each round.'
    RecoverHP: '-'
    RecoverSP: '-'
    RecoverPP: '-'
    RecoverAbil: '-'
    OtherEffects: '+2 circumstance modifier to Perception-based actions'
