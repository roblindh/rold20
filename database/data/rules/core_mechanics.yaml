    Description: 'Spell/action/trait: causes a fear effect.'
  -
    ID: 16
    Descriptor: Fire
    Notation: '[Fire]'
    Description: 'Spell/action: causes fire energy damage (or protects against it), or is related to the fire element.\nCreature: immune to fire/heat and vulnerable to cold.'
  -
    ID: 17
    Descriptor: Force
    Notation: '[Force]'
    Description: 'Spell/action: causes force damage (usually blunt physical damage) or creates a telekinetic effect.'
  -
    ID: 18
    Descriptor: Good
