abilityscores:
  -
    ID: 1
    AbilityScore: Strength
    Abbreviation: Str
    Description: 'Affects Fortitude defense, some melee attack rolls, melee weapon damage, some skill action rolls, strength ability checks, and carrying capacity.'
    NoScore: 'Cannot exert force or physically manipulate objects; fail all Str checks; may be allowed to use Dex modifier for some attacks.'
  -
    ID: 2
    AbilityScore: Constitution
    Abbreviation: Con
    Description: 'Affects Fortitude defense, starting hit points, starting stamina points, some skill action rolls, and constitution ability checks.'
    NoScore: 'Immune to ability damage, energy drain, and attacks against Fort defense; have no stamina points and do not suffer fatigue; fail all Con checks.'
  -
    ID: 3
    AbilityScore: Dexterity
    Abbreviation: Dex
    Description: 'Affects Defense Class, Reflex defense, some melee attack rolls, most ranged attack rolls, initiative rolls, some skill action rolls, and dexterity ability checks.'
    NoScore: 'Cannot move; fail all Dex checks, and attacks against Ref defense always have full effect; no initiative modifier.'
  -
    ID: 4
    AbilityScore: Intelligence
    Abbreviation: Int
    Description: 'Affects Reflex defense, some magical attack rolls, some skill action rolls, and intelligence ability checks.'
    NoScore: 'Fail all Int checks; can never learn skills; immune to mind-affecting attacks.'
  -
    ID: 5
    AbilityScore: Wisdom
    Abbreviation: Wis
    Description: 'Affects Will defense, starting power points, some magical attack rolls, some skill action rolls, and wisdom ability checks.'
    NoScore: 'Must be an object; have no power points and do not suffer mental fatigue.'
  -
    ID: 6
    AbilityScore: Charisma
    Abbreviation: Cha
    Description: 'Affects Will defense, some magical attack rolls, some skill action rolls, and charisma ability checks.'
    NoScore: 'Must be an object.'
