    Description: 'Spell/action: creates or uses an extradimensional or extraplanar effect.'
  -
    ID: 12
    Descriptor: Earth
    Notation: '[Earth]'
    Description: 'Spell/action/creature: related to the earth element.'
  -
    ID: 13
    Descriptor: Electricity
    Notation: '[Electric]'
    Description: 'Spell/action: causes electrical energy damage (or protects against it).'
  -
    ID: 14
    Descriptor: Evil
    Notation: '[Evil]'
    Description: 'Creature/weapon/spell/trait: has an evil aura and can bypass DR susceptible to evil.'
  -
    ID: 15
    Descriptor: Fear
