descriptors:
  -
    ID: 1
    Descriptor: Acid
    Notation: '[Acid]'
    Description: 'Spell/action: causes acid energy damage (or protects against it).'
  -
    ID: 2
    Descriptor: Air
    Notation: '[Air]'
    Description: 'Spell/action/creature: related to the air element.'
  -
    ID: 3
    Descriptor: Aquatic
    Notation: '[Aquatic]'
    Description: 'Creature: has native swim speed and does not have to make Athletics (Swim) checks to move through water; can breathe underwater (or at least hold its breath ten times longer than non-aquatic creatures).'
  -
    ID: 4
    Descriptor: 'Attack of Opportunity'
    Notation: '[AoO]'
    Description: 'Action: using this action triggers attacks of opportunity from creatures that threaten you.'
  -
    ID: 5
    Descriptor: Augmented
    Notation: '[Augmented]'
    Description: 'Creature: augmented with a template or special power.'
  -
    ID: 6
    Descriptor: Boost
    Notation: '[Boost]'
    Description: 'Action: an action that can be boosted somehow with an additional investment of AP. A maximum of half your AP total can be used to boost a single action.'
  -
    ID: 7
    Descriptor: Chaotic
    Notation: '[Chaotic]'
    Description: 'Creature/weapon/spell/trait: has a chaotic aura and can bypass DR susceptible to chaotic.'
