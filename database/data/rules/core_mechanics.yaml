    Descriptor: Psychic
    Notation: '[Psych]'
    Description: 'Spell/action: causes psychic damage or protects against psychic damage.'
distanceunits:
  -
    ID: 1
    Name: Personal
    ShortName: pers
    SquaresFactor: 0
    RangeDescription: 'The action affects only you.'
  -
    ID: 2
    Name: Touch
    ShortName: tch
    SquaresFactor: 1
    RangeDescription: 'You must  be able to touch or handle the target(s) with one or both hands (or similar primary attack form). Willing targets can be touched automatically, but unwilling targets require an attack roll (with appropriate modifiers for a natural attack).\nUnless otherwise specified, the action time includes the time required for touching one target. The AP cost for touching additional targets is the same as for a natural attack.'
  -
    ID: 3
    Name: Reach
    ShortName: rch
    SquaresFactor: 1
    RangeDescription: 'You must strike the target(s) of the action with a natural weapon or appropriate focus. Any natural weapon (hand, foot, claw, bite, etc.), even if covered with clothing or armor, can be used for the attack. Note that some actions with this range require two checks, first one to activate the action itself and then one for the reach attack.\nUnless otherwise specified, the action time includes the time required for one basic melee attack (with normal modifiers and dealing normal weapon damage). If the action allows more than one target, each additional attack costs full AP.'
  -
    ID: 4
    Name: Ranged
    ShortName: rng
    SquaresFactor: 1
    RangeDescription: 'The effect works similar to a ranged weapon and requires an attack roll against the DeC of each target (typically in addition to the action check itself).\nThe specified range is actually a range increment, and each multiple incurs a cumulative -2 attack penalty. The maximum range is ten range increments, unless otherwise specified.'
  -
    ID: 5
    Name: 0
    ShortName: 0
    SquaresFactor: 0
    RangeDescription: "You are the effect's point of origin (but the area can still affect other targets)."
  -
    ID: 6
    Name: Squares
    ShortName: sq
    SquaresFactor: 1
    RangeDescription: "The maximum range of the action's effect is the specified number of squares."
  -
    ID: 7
    Name: Close
    ShortName: cls
    SquaresFactor: 10
    RangeDescription: 'The maximum range is equal to 5 + (skill level / 2) squares.'
  -
    ID: 8
    Name: Medium
    ShortName: mdm
    SquaresFactor: 40
    RangeDescription: 'The maximum range is equal to 20 + (skill level x 2) squares.'
  -
    ID: 9
    Name: Long
    ShortName: lng
    SquaresFactor: 160
    RangeDescription: 'The maximum range is equal to 80 + (skill level x 8) squares.'
  -
    ID: 10
    Name: Infinite
    ShortName: inf
    SquaresFactor: 1000000
    RangeDescription: 'The effect can reach anywhere within the same plane of existence.'
  -
    ID: 11
    Name: Extraplanar
    ShortName: ext
    SquaresFactor: 1000000000
    RangeDescription: 'The effect can reach anywhere in any plane of existence.'
