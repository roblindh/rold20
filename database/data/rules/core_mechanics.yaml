    DurationDescription: 'When the specified time expires, the effect ends.'
  -
    ID: 4
    Name: Days
    ShortName: d
    RoundsFactor: 14400
    ActionTimeDescription: 'For these long action times, full continuous concentration is neither possible nor required. If it is possible to spend part of the time on other activities, the percentage of time spent on the action is specified.'
    DurationDescription: 'When the specified time expires, the effect ends.'
  -
    ID: 5
    Name: Hours
    ShortName: h
    RoundsFactor: 600
    ActionTimeDescription: 'For these long action times, full continuous concentration is neither possible nor required. If it is possible to spend part of the time on other activities, the percentage of time spent on the action is specified.'
    DurationDescription: 'When the specified time expires, the effect ends.'
  -
    ID: 6
    Name: Minutes
    ShortName: min
    RoundsFactor: 10
    ActionTimeDescription: 'The specified number of minutes must be spent to complete or initiate the action.'
    DurationDescription: 'The effect ends after the specified number of minutes (multiply by 10 to get the number of rounds).'
  -
    ID: 7
    Name: Rounds
    ShortName: 'x r'
    RoundsFactor: 1
    ActionTimeDescription: 'The specified number of complete rounds must be spent to complete or initiate the action. Partial rounds do not count. The action or effect takes place just before the start of your turn on the round after the specified number of rounds.'
    DurationDescription: "The effect ends after the specified number of full rounds. The effect ends at the same initiative count that it started, but at the end of the activator's turn."
  -
    ID: 8
    Name: 'Full round'
    ShortName: r
    RoundsFactor: 1
    ActionTimeDescription: 'A complete round (all AP and MP for the round) must be spent to complete or initiate the action. The action or effect takes place at the end of your current turn.'
    DurationDescription: null
  -
    ID: 9
    Name: 'Partial round'
    ShortName: '1/4 r'
    RoundsFactor: 0
    ActionTimeDescription: "It takes the specified fraction of a round to complete or initiate the action. Deduct the same fraction of the creature's action points and movement points (rounded up) for this round."
    DurationDescription: null
  -
    ID: 10
    Name: AP
    ShortName: AP
    RoundsFactor: 0
    ActionTimeDescription: 'The specified number of action points must be spent to complete or initiate the action.\nIf you have an insufficient number of AP left of your turn, you can spend your remaining AP to initiate the action and pay the rest on your next turn. For many actions, interruption is then possible and may require skill checks to maintain concentration until the action is finished.'
    DurationDescription: null
  -
    ID: 11
    Name: MP
    ShortName: MP
    RoundsFactor: 0
    ActionTimeDescription: 'The specified number of movement points must be spent to complete or initiate the action.\nIf you have an insufficient number of MP left of your turn, you cannot initiate the action.'
    DurationDescription: null
  -
    ID: 12
    Name: Encounter
    ShortName: enc
    RoundsFactor: 100
    ActionTimeDescription: null
    DurationDescription: 'The effect ends when the current encounter ends. If the action or effect is used outside of an encounter, the duration is limited to approximately 1 minute per skill level.'
  -
    ID: 13
    Name: Instantaneous
    ShortName: instant
    RoundsFactor: 0
    ActionTimeDescription: null
    DurationDescription: 'The actual effect lasts only an instant, but its consequences may be long-lasting or permanent.'
  -
    ID: 14
    Name: Permanent
    ShortName: perm
    RoundsFactor: 100000000
    ActionTimeDescription: null
    DurationDescription: 'The effect has unlimited duration. If it is magical in nature, however, it can still be dispelled.'
  -
    ID: 15
    Name: Concentration
    ShortName: conc
    RoundsFactor: 0
    ActionTimeDescription: null
    DurationDescription: 'The effect lasts for as long as concentration is maintained (and sometimes an additional specified duration after that).\nWhile concentrating, you can spend only half your AP and MP each round on other actions (and only on actions without the concentration implement).\nAn action that triggers attacks of opportunity (AoO) will trigger another AoO at the beginning of each round of concentration. Every situation that can break your concentration will typically require a new skill check.'
  -
    ID: 16
    Name: Reaction
    ShortName: react
    RoundsFactor: 0
    ActionTimeDescription: "This means that the action can be performed as a reaction to another creature's action or some other triggering event. Unless otherwise specified, the reactive action is free and requires no AP to perform, but a creature can only perform one reactive action per triggering action, and each creature has a limited total number of reactions per round."
    DurationDescription: null
  -
    ID: 17
    Name: Ongoing
    ShortName: ong
    RoundsFactor: 0
    ActionTimeDescription: null
    DurationDescription: "The effect lasts as long as the specified cost is paid. The activator can dismiss the effect and stop paying the cost at any time (without a dismiss action), and the effect ends automatically if the activator becomes unable to pay the cost. However, the effect does not require any type of concentration; it continues even if the activator becomes unconscious or leaves the effect's range.\\nWhen the effect is activated from an item with a power pool, the ongoing cost is paid from the pool, and the item's owner chooses when to dismiss the effect. If the effect is triggered from an item without a power pool, the effect's surplus PP (if any) is used to power the effect, and the effect ends as soon as those PP run out."
  -
    ID: 18
    Name: Passive
    ShortName: passive
    RoundsFactor: 0
    ActionTimeDescription: 'This action is used passively in response to something else.'
    DurationDescription: null
