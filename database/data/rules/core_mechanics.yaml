    Description: 'Creature/weapon/spell/trait: has a good aura and can bypass DR susceptible to good.'
  -
    ID: 19
    Descriptor: Illusion
    Notation: '[Illusion]'
    Description: 'Spell/action: creates an illusionary effect.'
  -
    ID: 20
    Descriptor: Incorporeal
    Notation: '[Incorporeal]'
    Description: 'Spell/action: makes a target incorporeal.\nCreature: is or can become incorporeal.'
  -
    ID: 21
    Descriptor: Language-dependent
    Notation: '[Lang]'
    Description: 'Spell/action: works only if the user and target can communicate using a shared language.'
  -
    ID: 22
    Descriptor: Lawful
    Notation: '[Lawful]'
    Description: 'Creature/weapon/spell/trait: has a lawful aura and can bypass DR susceptible to lawful.'
  -
    ID: 23
    Descriptor: Light
    Notation: '[Light]'
    Description: 'Spell/action: creates a light or color-based effect.'
  -
    ID: 24
    Descriptor: Mind-affecting
    Notation: '[Mind]'
    Description: 'Spell/action: causes a mental effect. It does not work against creatures with Int 0 or Int -.'
  -
    ID: 25
    Descriptor: Move
    Notation: '[Move]'
    Description: 'Action: a movement action that requires MP (or AP converted to MP).'
  -
    ID: 26
    Descriptor: Necrotic
    Notation: '[Necrotic]'
    Description: 'Spell/action: causes necrotic energy damage (or protects against it).'
  -
    ID: 27
    Descriptor: Poison
