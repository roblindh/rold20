alignments:
  -
    ID: 1
    Name: 'Lawful Good'
    Description: 'A lawful good character acts as a good person is expected or required to act. She combines a commitment to oppose evil with the discipline to fight relentlessly. She tells the truth, keeps her word, helps those in need, and speaks out against injustice. A lawful good character hates to see the guilty go unpunished.'
    Opposed: 'Any chaotic, any evil'
    Diametric: 'Chaotic evil'
    Compatible: 'Lawful good, neutral good, lawful neutral'
  -
    ID: 2
    Name: 'Neutral Good'
    Description: 'A neutral good character does the best that a good person can do. He is devoted to helping others. He works with kings and magistrates but does not feel beholden to them.'
    Opposed: 'Any evil'
    Diametric: 'Neutral evil'
    Compatible: 'Any good, neutral'
  -
    ID: 3
    Name: 'Chaotic Good'
    Description: "A chaotic good character acts as his conscience directs him with little regard for what others expect of him. He makes his own way, but he's kind and benevolent. He believes in goodness and right but has little use for laws and regulations. He hates it when people try to intimidate others and tell them what to do. He follows his own moral compass, which, although good, may not agree with that of society."
    Opposed: 'Any lawful, any evil'
    Diametric: 'Lawful evil'
    Compatible: 'Neutral good, chaotic good, chaotic neutral'
  -
    ID: 4
    Name: 'Lawful Neutral'
    Description: 'A lawful neutral character acts as law, tradition, or a personal code directs her. Order and organization are paramount to her. She may believe in personal order and live by a code or standard, or she may believe in order for all and favor a strong, organized government.'
    Opposed: 'Any chaotic'
    Diametric: 'Chaotic neutral'
    Compatible: 'Any lawful, neutral'
  -
    ID: 5
    Name: Neutral
    Description: "A neutral character does whatever seems to be a good idea. She doesn't feel strongly one way or the other when it comes to good vs. evil or law vs. chaos. Most neutral characters exhibit a lack of conviction or bias rather than a commitment to neutrality. Such a character thinks of good as better than evil - after all, she would rather have good neighbors and rulers than evil ones. Still, she's not personally committed to upholding good in any abstract or universal way. Some neutral characters, on the other hand, commit themselves philosophically to neutrality. They see good, evil, law, and chaos as prejudices and dangerous extremes. They advocate the middle way of neutrality as the best, most balanced road in the long run."
    Opposed: None
    Diametric: None
    Compatible: 'Neutral good, lawful neutral, chaotic neutral, neutral evil'
  -
    ID: 6
    Name: 'Chaotic Neutral'
    Description: "A chaotic neutral character follows his whims. He is an individualist first and last. He values his own liberty but doesn't strive to protect others' freedom. He avoids authority, resents restrictions, and challenges traditions. A chaotic neutral character does not intentionally disrupt organizations as part of a campaign of anarchy. To do so, he would have to be motivated either by good (and a desire to liberate others) or evil (and a desire to make those different from himself suffer). A chaotic neutral character may be unpredictable, but his behavior is not totally random. He is not as likely to jump off a bridge as to cross it."
    Opposed: 'Any lawful'
    Diametric: 'Lawful neutral'
    Compatible: 'Any chaotic, neutral'
  -
    ID: 7
    Name: 'Lawful Evil'
    Description: 'A lawful evil villain methodically takes what he wants within the limits of his code of conduct without regard for whom it hurts. He cares about tradition, loyalty, and order but not about freedom, dignity, or life. He plays by the rules but without mercy or compassion. He is comfortable in a hierarchy and would like to rule, but is willing to serve. He condemns others not according to their actions but according to race, religion, homeland, or social rank. He is loath to break laws or promises. This reluctance comes partly from his nature and partly because he depends on order to protect himself from those who oppose him on moral grounds. Some lawful evil villains have particular taboos, such as not killing in cold blood (but having underlings do it) or not letting children come to harm (if it can be helped). They imagine that these compunctions put them above unprincipled villains. Some lawful evil people and creatures commit themselves to evil with a zeal like that of a crusader committed to good. Beyond being willing to hurt others for their own ends, they take pleasure in spreading evil as an end unto itself. They may also see doing evil as part of a duty to an evil deity or master.'
    Opposed: 'Any chaotic, any good'
    Diametric: 'Chaotic good'
    Compatible: 'Lawful neutral, lawful evil, neutral evil'
  -
    ID: 8
    Name: 'Neutral Evil'
    Description: "A neutral evil villain does whatever she can get away with. She is out for herself, pure and simple. She sheds no tears for those she kills, whether for profit, sport, or convenience. She has no love of order and holds no illusion that following laws, traditions, or codes would make her any better or more noble. On the other hand, she doesn't have the restless nature or love of conflict that a chaotic evil villain has. Some neutral evil villains hold up evil as an ideal, committing evil for its own sake. Most often, such villains are devoted to evil deities or secret societies."
    Opposed: 'Any good'
    Diametric: 'Neutral good'
    Compatible: 'Any evil, neutral'
  -
    ID: 9
    Name: 'Chaotic Evil'
    Description: 'A chaotic evil character does whatever his greed, hatred, and lust for destruction drive him to do. He is hot-tempered, vicious, arbitrarily violent, and unpredictable. If he is simply out for whatever he can get, he is ruthless and brutal. If he is committed to the spread of evil and chaos, he is even worse. Thankfully, his plans are haphazard, and any groups he joins or forms are poorly organized. Typically, chaotic evil people can be made to work together only by force, and their leader lasts only as long as he can thwart attempts to topple or assassinate him.'
    Opposed: 'Any lawful, any good'
    Diametric: 'Lawful good'
    Compatible: 'Chaotic neutral, neutral evil, chaotic evil'
