hazards:
  -
    ID: 1
    Hazard: 'Cave-in or ceiling collapse'
    EL: 8
    Details: 'In bury zone, +5 attack vs. Ref (S - 8d6 HP B damage and buried under rubble; F - 1/2 damage and buried; OF - no damage).\nIn slide zone, +5 attack vs. Ref (S - 3d6 HP B damage and buried under rubble; F - no damage). Buried characters take 1d6 SP per minute. Once buried, it takes a DC 25 Str check to escape.'
  -
    ID: 2
    Hazard: 'Avalanche (rock or snow)'
    EL: 7
    Details: 'A typical avalanche is d6 x 20 squares wide. Snow and ice avalanches advance 100 sq per round, while rock and earth avalanches advance 50 sq per round.\nIn bury zone, +5 attack vs. Ref (S - 8d6 HP B damage and buried under rubble; F - 1/2 damage and buried; OF - no damage).\nIn slide zone, +5 attack vs. Ref (S - 3d6 HP B damage and buried under rubble; F - no damage). Buried characters take 1d6 SP per minute. Once buried, it takes a DC 25 Str check to escape.'
  -
    ID: 3
    Hazard: 'Forest fire'
    EL: 6
    Details: 'Can be spotted at a distance of 100 to 400 m, depending on Spot check. The heat can be felt at a distance of 30 m. Moderate winds can cause the fire to move downwind 24 squares per round. Each portion of forest remains ablaze for 2d4x10 minutes. Creatures caught in the fire take damage from both the fire and the smoke.'
  -
    ID: 4
    Hazard: 'Green slime'
    EL: 4
    Details: 'Detects movement and drops from the ceiling. Devours flesh and organic materials and dissolves metals on contact. It causes 1d6 Con damage per round of contact, and it deals 2d6 HP of damage per round to metal and wood (ignoring DR). It can be scraped off on the 1st round, but after that it must be frozen, burned, or cut off.'
  -
    ID: 5
    Hazard: 'Yellow mold'
    EL: 6
    Details: 'When disturbed, it releases spores in a 2 sq radius. +5 attack vs. Fort (S - 1d6 Con damage; CS - 3d6 Con damage). Fire destroys the mold, and sunlight renders it dormant.'
  -
    ID: 6
    Hazard: 'Brown mold'
    EL: 2
    Details: 'Draws heat from the environment, causing 3d6 SP of cold damage per round in 1 sq radius. Fire causes it to grow in size, but cold kills it.'
  -
    ID: 7
    Hazard: Quicksand
    EL: 2
    Details: 'DC 15 to spot; requires DC 10 swim check to tread water (OS - move 1 square in any direction, F - sink below surface); DC 15 Str check to pull oneself or someone else out.'
  -
    ID: 8
    Hazard: Flood
    EL: 4
    Details: 'Typical floods can make streams and rivers 1d4 squares deeper and 1d4 x 50% wider. Flash floods can turn dry areas into rapids in a matter of minutes and typically last 3d4 hours. For creatures caught in the open when a flash flood strikes, +5 attack vs. Ref (S - 3d6 HP B damage; F - no damage).'
  -
    ID: 9
    Hazard: 'Lava bomb, small'
    EL: 2
    Details: 'Molten rock hurled from volcano. +5 attack vs. Ref in 6 sq radius burst (S - 2d6 HP B and 2d6 HP fire damage; F - 1/2 damage; OF - no damage).'
  -
    ID: 10
    Hazard: 'Lava bomb, large'
    EL: 5
    Details: 'Molten rock hurled from volcano. +5 attack vs. Ref in 6 sq radius burst (S - 6d6 HP B and 6d6 HP fire damage; F - 1/2 damage; OF - no damage).'
  -
    ID: 11
    Hazard: 'Pyroclastic flow'
    EL: 10
    Details: 'A typical flow is d6 x 20 squares wide and advances 100 sq per round.\nIn bury zone, +5 attack vs. Ref (S - 10d6 HP fire damage per round and buried; F - 1/2 damage and buried; OF - no damage).\nIn slide zone, +5 attack vs. Ref (S - 2d6 HP fire damage per round and buried; F - no damage). Poisonous gas also causes 2d6 SP per round. Once buried, it takes a DC 25 Str check to escape.'
