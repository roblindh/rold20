    ID: 16
    Name: 'Ranged Trip'
    Category: 4
    Descriptors: '[Untrained]'
    ActionCheck: 'Ranged attack roll vs. DeC\nThen d20! + Str mod vs. d20! + Str or Dex mod'
    ActionTime: "8 + weapon's size mod AP (minimum 5 AP)"
    Trigger: null
    Implements: 'C, ranged weapon'
    Cost: '1 SP'
    Range: 'As per weapon (LoE)'
    Duration: null
    Target: '1 target'
    Description: 'You can attempt to trip an opponent with certain ranged weapons, such as bolas and lariats.\nIf the attack roll succeeds, you make a Strength check opposed by the target''s Strength or Dexterity check.\nTrip will only work against creatures within one size category of the attacker.\nIf a flying creature is tripped, it starts falling (as if unable to maintain minimum forward speed).\nTrip can also be used to unhorse a mounted opponent. A Ride check can be made in place of the defender''s Str/Dex check.'
    Results: 'If the weapon attack hits, the secondary attack has the following effects:\nS - The target is knocked prone.\nF - You fail to trip the opponent.'
    Difficulties: null
    Modifiers: 'The following modifiers do not apply to the ranged attack but to the Str check:\nTarget is smaller than you: +4\nTarget is larger than you: -4\nTarget has more than two legs: -4\nTarget has Acrobatics skill: -1 syn per 5 lvls'
    APBoost: '+1 attack bonus per AP'
    ShowPCGen: 1
  -
    ID: 17
    Name: 'Splash Attack'
    Category: 4
    Descriptors: '[Untrained]'
    ActionCheck: 'd20! + Dex mod + size mod + range mod + (Weapons - Area Attacks skill) + PAM + other mods vs. DeC'
    ActionTime: "8 + weapon's size mod AP (minimum 5 AP)"
    Trigger: null
    Implements: 'C, ranged splash weapon'
    Cost: '1 SP'
    Range: 'Per weapon (default 2)'
    Duration: null
    Target: 'Per weapon (default 1 sq radius sphere)'
    Description: 'You throw a splash weapon at a creature or a square.'
    Results: 'S - You deal normal damage to the target.\nF - You miss. To find out where the weapon lands, roll 1d8 to determine a direction away from the target square, and determine distance by multiplying the weapon''s base range by d% percent.\nRegardless of success, roll separate attack rolls (according to the weapon; default +4) against the Ref of creatures in the splash area.'
    Difficulties: null
    Modifiers: 'Primary target is adjacent to ally: -4'
    APBoost: '+1 attack bonus per AP'
    ShowPCGen: 1
  -
    ID: 18
    Name: 'Spray Attack'
    Category: 4
    Descriptors: '[Untrained]'
    ActionCheck: 'd20! + Dex mod + size mod + (Weapons - Area Attacks skill) + PAM + other mods vs. Ref'
    ActionTime: "8 + weapon's size mod AP (minimum 5 AP)"
    Trigger: null
    Implements: 'C, spray weapon'
    Cost: '1 SP'
    Range: 0
    Duration: null
    Target: 'Per weapon (default 1 sq conical burst)'
    Description: 'You use a spray weapon against one or more opponents within range. Even throwing sand or flour can be considered a spray attack.'
    Results: 'S - You deal normal damage.\nF - You typically deal half normal damage (depending on the weapon).\nCF - You deal normal damage to yourself.'
    Difficulties: null
    Modifiers: 'Target is adjacent to ally: -4'
    APBoost: '+1 attack bonus per AP'
    ShowPCGen: 1
  -
    ID: 19
    Name: 'Bull Rush'
    Category: 5
    Descriptors: '[Untrained, AoO]'
    ActionCheck: 'd20! + Str mod + grapple size mod + (Weapons - Brawling skill) + PAM vs. opposed d20! + Str mod + grapple size mod + (Weapons - Brawling skill) + PAM'
    ActionTime: '8 + size mod AP (minimum 5 AP)'
    Trigger: null
    Implements: C
    Cost: '1 SP'
    Range: Rch
    Duration: null
    Target: '1 or more targets'
    Description: 'You try to rush an opponent and push him back.\nYou first move into your target''s square (paying MP and provoking attacks of opportunity for the move). You then try to push the target out of the square with an opposed Strength check.\nYou can only Bull Rush opponents that are within two size categories of yourself.'
    Results: 'S - The target is pushed back one square (away from your direction of movement). For every 5 levels of success, you can push back the opponent one more square, but you have to move with him and pay 1 additional AP per square moved. Both you and the target provoke attacks of opportunity for this move.\nF - You are pushed back into the last square you occupied before the attack.'
    Difficulties: null
    Modifiers: 'Target has more than two legs: -4\nBull rush with charge: +2\nEach additional target after the first: -4 (cumulative)'
    APBoost: '+1 attack bonus per AP'
    ShowPCGen: 1
  -
    ID: 20
    Name: Crush
    Category: 5
    Descriptors: '[Untrained, AoO]'
    ActionCheck: 'd20! + Str mod + (Weapons - Brawling skill) + PAM vs. Ref'
    ActionTime: '8 + size mod AP (minimum 5 AP)'
    Trigger: null
    Implements: C
    Cost: '1 SP'
    Range: Rch
    Duration: null
    Target: 'Your spacing'
    Description: 'You try to crush opponents under your own body.\nYou first move or jump into the targeted area (paying MP and provoking attacks of opportunity for the move) and fall prone. By doing this, you try to pin and crush the target(s) under your own body.\nYou can only Crush opponents that are two or more size categories smaller than yourself, since larger creatures can push you out of their square.'
    Results: 'S - You crush the target under your body, causing blunt damage according to your size (Tiny 1d4 B, Small 1d6 B, Medium 1d8 B, Large 2d6 B, Huge 3d6 B, Gargantuan 4d6 B, Colossal 5d6 B; add Str mod to the damage).\nAffected targets are considered grappled until they escape, you move, or you stand up from prone.\nF - The target moves out of your way (for free) into any adjacent square.'
    Difficulties: null
    Modifiers: 'Crush with charge: +2'
    APBoost: '+1 attack bonus per AP'
    ShowPCGen: 1
  -
    ID: 21
    Name: Overrun
    Category: 5
    Descriptors: '[Untrained, AoO]'
    ActionCheck: 'd20! + Str mod + grapple size mod + (Weapons - Brawling skill) + PAM vs. opposed d20! + Str or Dex mod + grapple size mod + (Weapons - Brawling skill) + PAM'
    ActionTime: '8 + size mod AP (minimum 5 AP)'
    Trigger: null
    Implements: C
    Cost: '1 SP'
    Range: Rch
    Duration: null
    Target: '1 or more targets'
    Description: 'You try to rush your opponent and knock him prone.\nYou first move into your target''s square (paying MP and provoking attacks of opportunity for the move).\nYour opponent can simply choose to avoid you, and in that case, you continue your move out of the square (and action time is reduced by 4 AP).\nIf your opponent tries to block, you make the opposed check shown above.\nIf your spacing would allow you to overrun multiple targets, you can compare your action check against each potential target''s opposed check (with the appropriate modifiers).'
    Results: 'S - The defender is knocked prone, and you can choose to continue your movement.\nIf the target is smaller than you, you can make a free leg attack against it.\nF - You are pushed back into the previous square.\nEF - You are pushed back into the previous square and knocked prone.'
    Difficulties: null
    Modifiers: 'Target has more than two legs: -4\nOverrun with charge: +2\nEach additional target after the first: -4 (cumulative)'
    APBoost: '+1 attack bonus per AP'
    ShowPCGen: 1
  -
    ID: 22
    Name: 'Initiate Grapple'
    Category: 5
    Descriptors: '[Untrained, AoO]'
    ActionCheck: 'd20! + Dex mod + size mod + (Weapons - Brawling skill) + PAM vs. DeC'
    ActionTime: '8 + size mod AP (minimum 5 AP)'
    Trigger: null
    Implements: 'C, primary attack(s)'
    Cost: '1 SP'
    Range: Rch
    Duration: null
    Target: '1 target'
    Description: 'To start a grapple, first make the indicated action check against your opponent. If the attack of opportunity causes damage, the grapple automatically fails. If the target is already grappling with someone else, this check is automatically successful.\nIf you successfully initiate a grapple with a target two or more size categories larger than you, you are holding onto the target, but the target is not considered grappled (unless it chooses to be).'
    Results: 'S - You are now grabbing (but not grappling) the target. Next, make a free grapple attack (see Grapple Attack action). If this attack succeeds, you deal normal grapple damage to the target, move into the target''s square, and are now grappling with the target. This move provokes attacks of opportunity from opponents other than the target.\nAs an alternative to dealing damage, the attacker can choose among the other effects listed under the grapple attack action (except pin).\nIf the free grapple attack fails, the grapple is not successfully initiated.\nF - You lose the grab and fail to initiate the grapple.'
    Difficulties: null
    Modifiers: 'More free primary natural attacks than opponent: +4\nUsing a single primary attack form: -20 (the attacker is not considered grappled; this also means that the attacker can move normally, carrying along all grapplers)'
    APBoost: '+1 attack bonus per AP'
    ShowPCGen: 1
  -
    ID: 23
    Name: 'Grapple Attack'
    Category: 5
    Descriptors: '[Untrained]'
    ActionCheck: 'd20! + Str mod + grapple size mod + (Weapons - Brawling skill) + PAM vs. opposed grapple attack check'
    ActionTime: '6 + size mod AP (minimum 5 AP)'
    Trigger: null
    Implements: C
    Cost: '1 SP'
    Range: Rch
    Duration: null
    Target: '1 grappling target'
    Description: 'While grappling, you can use grapple attacks to inflict damage or control your opponent in different ways.\nGrapple attacks can only be made after a grapple has been initiated, but they can be made by anyone involved in the grappling.'
    Results: 'S - The grapple attack inflicts the same damage as an unarmed attack made by the attacker. To be more specific, this attack can involve an elbow to the face, a claw attack, bending the opponent''s joints, crushing him with a bear hug, etc. Use the damage modifier either from Weapons - Generic, Weapons - Brawling, or Weapons - Natural, whichever is higher.\nAlternatively, a successful check can be used to achieve one of the following results:\n- Draw a light weapon, material component, or other accessible item.\n- Use a light weapon (already drawn) to deal damage to another grappler as if using a melee attack.\n- Escape from the grapple and move into an adjacent space. Your check has to beat all opposing grapplers for it to be successful.\n- Move all grapplers (including yourself) one or two squares. Your check has to beat all opposing grapplers for it to be successful.\n- Pin another grappler for 1 round. You can only pin one opponent at a time.\n- Break another grappler''s pin.\n- Knock another grappler prone.\n- Use a light weapon held by another grappler to attack him or another grappler. This first requires a successful grapple check and then a melee attack roll with a -4 attack penalty.\n\nOnce you have an opponent pinned, further successful checks can also be used to achieve these results:\n- Throw the pinned opponent into an adjacent square (if no other grappler is also grappling the same opponent). For every 5 levels of success, you can throw the opponent one square further away, causing damage as if the opponent had fallen the same distance. The thrown opponent is no longer pinned or grappled.\n- Try to incapacitate the pinned opponent, causing twice the normal grappling damage in SP.\n- Prevent the pinned opponent from speaking (and using verbal components) until the pin ends.\n- The pinned opponent can be used as an improvised weapon or shield against non-grappling opponents until the pin ends.\n- If you have a mouth and are four or more size categories larger than the pinned opponent (or have an improved swallow ability), you can swallow the opponent. This automatically causes bite damage. The opponent is considered grappled even after being swallowed, but the swallower is no longer grappled.\n- If you have a rope readily available, two consecutive successful checks allow you to tie up two of the pinned opponent''s limbs (as a free Use Rope action).\n\nF - You inflict no damage.'
    Difficulties: null
    Modifiers: 'More free primary natural attacks than opponent: +4\nUsing a single primary attack form: -20 (the attacker is not considered grappled)'
    APBoost: '+1 attack bonus per AP\n+1 damage bonus per AP'
    ShowPCGen: 1
  -
    ID: 24
    Name: 'Charge Attack'
