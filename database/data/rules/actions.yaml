    Difficulties: null
    Modifiers: 'The following modifiers do not apply to the melee attack but to the defender''s Str check:\nTarget item is larger than Medium: +4 per size category\nTarget item is smaller than Medium: -4 per size category\nTarget item is exposed but not a melee weapon: -4\nTarget item is semi-exposed (e.g. necklace, helmet, weapon in scabbard): +4\nTarget item is held in locked gauntlet or hard to reach or grab (e.g. ring): +10'
    APBoost: '+1 attack bonus per AP\n+1 damage bonus per AP'
