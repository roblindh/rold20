  -
    ID: 9
    Name: 'Melee Attack'
    Category: 3
    Descriptors: '[Untrained]'
    ActionCheck: 'd20! + Str or Dex mod + size mod + weapon skill + skill mod + PAM + other mods vs. DeC'
    ActionTime: "8 + weapon's size mod AP (minimum 5 AP)"
    Trigger: null
    Implements: 'C, melee weapon'
    Cost: '1 SP'
    Range: "Weapon's reach"
    Duration: null
    Target: '1 target'
    Description: 'You make a normal attack with a melee weapon against an opponent within reach.\nIf the defender has a threatening weapon larger than your weapon, you provoke an attack of opportunity from the defender.'
    Results: 'S - You deal normal damage.\nES - Halve DR against this attack.\nCS - You deal additional damage according to the weapon''s critical multiplier.\nF - You miss.\nEF - You deal normal damage to your weapon (no effect for natural weapons).\nCF - The defender can try to deflect your attack back on you or against another target adjacent to you both. The defender can make a free attack as if using your weapon with a -4 penalty.'
    Difficulties: null
    Modifiers: null
    APBoost: '+1 attack bonus per AP\n+1 damage bonus per AP'
    ShowPCGen: 1
  -
    ID: 10
    Name: 'Melee Disarm'
    Category: 3
    Descriptors: '[Untrained]'
    ActionCheck: "Melee attack roll vs. DeC + target weapon's size mod"
    ActionTime: "8 + your weapon's size mod AP (minimum 5 AP)"
    Trigger: null
    Implements: 'C, melee weapon'
    Cost: '1 SP'
    Range: "Weapon's reach"
    Duration: null
    Target: '1 target'
    Description: 'You try to knock your opponent''s weapon, shield, wand, or other exposed item out of his hands.\nIf the defender has a threatening weapon larger than your weapon, you provoke an attack of opportunity from the defender. If this attack of opportunity causes damage, the disarm automatically fails.'
    Results: 'S - You hit the weapon, and the defender has to make a Str or Dex check against (5 + damage). If this check fails, the weapon or item is dropped (for every 5 levels of failure, it lands 1 sq further away). If you are doing the disarm with a hand (or other natural weapon with a grip), you can instead choose to grab the weapon or item for yourself.\nF - The disarm fails.\nEF - The defender manages to disarm you instead.'
    Difficulties: null
    Modifiers: 'Attacking weapon is larger than target item: +4 per size category\nAttacking weapon is smaller than target item: -4 per size category\nTarget item is exposed but not a melee weapon: +4\nTarget item is semi-exposed (e.g. necklace, helmet, weapon in scabbard): -4\nTarget item is held in locked gauntlet or hard to reach or grab (e.g. ring): -10\nDefender is pinned by attacker: +4'
    APBoost: '+1 attack bonus per AP\n+1 damage bonus per AP'
    ShowPCGen: 1
  -
    ID: 11
    Name: 'Melee Sunder'
    Category: 3
    Descriptors: '[Untrained]'
    ActionCheck: "Melee attack roll vs. DeC + target item's size mod"
    ActionTime: "8 + your weapon's size mod AP (minimum 5 AP)"
    Trigger: null
    Implements: 'C, melee weapon'
    Cost: '1 SP'
    Range: "Weapon's reach"
    Duration: null
    Target: '1 target'
    Description: 'You try to damage or destroy an opponent''s weapon, shield, or other object. This action does not work against worn armor.\nIf the defender has a threatening weapon larger than your weapon, you provoke an attack of opportunity from the defender.\nAlthough there are usually no special effects caused by striking specific body parts, it is possible to do so with this action.'
    Results: 'S - You deal normal damage against the object.\nES - Halve the item''s DR against this attack.\nCS - You deal additional damage to the object according to the weapon''s critical multiplier. Note, however, that most objects are resistant or immune to critical hits. Also, you deal normal (non-critical) damage to the object''s wielder.\nF - You miss.\nEF - You deal normal damage to your weapon (no effect for natural weapons).\nCF - The defender can try to deflect your attack back on you or against another target adjacent to you both. The defender can make a free attack as if using your weapon.'
    Difficulties: null
    Modifiers: 'Attacking weapon is larger than target item: +4 per size category\nAttacking weapon is smaller than target item: -4 per size category'
    APBoost: '+1 attack bonus per AP\n+1 damage bonus per AP'
    ShowPCGen: 1
  -
    ID: 12
    Name: 'Melee Trip'
    Category: 3
    Descriptors: '[Untrained]'
    ActionCheck: 'Melee attack roll vs. DeC\nThen d20! + Str mod vs. d20! + Str or Dex mod'
    ActionTime: "8 + weapon's size mod AP (minimum 5 AP)"
    Trigger: null
    Implements: 'C, melee weapon'
    Cost: '1 SP'
    Range: "Weapon's reach"
    Duration: null
    Target: '1 target'
    Description: 'You can attempt to trip an opponent with a natural weapon or with certain melee weapons.\nIf the defender has a threatening weapon larger than your weapon, you provoke an attack of opportunity from the defender.\nIf the attack roll succeeds, you make a Strength check opposed by the target''s Strength or Dexterity check.\nTrip will only work against creatures within one size category of the attacker.\nIf a flying creature is tripped, it starts falling (as if unable to maintain minimum forward speed).\nTrip can also be used to unhorse a mounted opponent. A Ride check can be made in place of the defender''s Str/Dex check.'
    Results: 'If the weapon attack hits, the secondary attack has the following effects:\nS - The target is knocked prone. For every 5 levels of success, you can choose to move (or actually throw) the opponent one square away, causing damage as if the opponent had fallen the same distance.\nF - You fail.\nEF - The target manages to trip you instead.'
    Difficulties: null
    Modifiers: 'The following modifiers do not apply to the melee attack but to the Str check:\nTarget is smaller than you: +4\nTarget is larger than you: -4\nTarget has more than two legs: -4\nTarget has Acrobatics skill: -1 syn per 5 lvls'
    APBoost: '+1 attack bonus per AP'
    ShowPCGen: 1
