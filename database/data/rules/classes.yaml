classes:
  -
    ID: 1
    Name: Bard
    Abbreviation: Brd
    HPPerLevel: 6
    SPPerLevel: 6
    PPPerLevel: 8
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Cha, Dex, Int'
    Alignment: Non-Lawful
    ClassTraits: null
    SpellKnowledge: 'Bards typically learn new spells from a teacher, an arcane spellbook, personal development, etc.'
    Notes: 'Most bards learn their trade as apprentices to a master bard or by attending a bardic college.'
    Roles: 'Entertainer, performer, actor, teacher, advisor, diplomat, spy.'
    OldRanks: 'Rhymer, Lyrist, Sonnateer, Skald, Racaraide, Jongleur, Troubador, Minstrel, Muse, Lorist, Bard, Master Bard'
  -
    ID: 2
    Name: Cleric
    Abbreviation: Clr
    HPPerLevel: 8
    SPPerLevel: 4
    PPPerLevel: 8
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Wis, Con, Cha'
    Alignment: 'Any (same as deity)'
    ClassTraits: null
    SpellKnowledge: 'A cleric''s church will teach him most of the spells that he has sufficient divine skills to cast.\nMore unusual spells can be learned from a teacher, divine writings, personal prayers, etc.'
    Notes: 'Most clerics are part of an ecclesiastical hierarchy, with obligations as well as benefits. Some, however, devote themselves to their deity or philosophy without joining the official church.\nClerics are common among nearly all races. Adventuring and crusading clerics are mostly seen among humans and dwarves, however.\nUnless the current situation prevents it, a cleric should pray regularly and observe all of the religion''s rituals and special holy days.\nA cleric who violates his deity or philosophy will lose the ability to channel divine energy (cast divine spells, turn undead, etc.) until he atones. He can still gain levels in the class and improve his divine skills, but they will be mostly useless until atonement.'
    Roles: 'Priest, advisor, healer, diplomat, judge, warrior-priest.'
    OldRanks: 'Acolyte, Adept, Priest, Curate, Prefect, Canon, Lama, Patriarch, High Priest'
  -
    ID: 3
    Name: Druid
    Abbreviation: Drd
    HPPerLevel: 6
    SPPerLevel: 6
    PPPerLevel: 8
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Wis, Dex'
    Alignment: Neutral
    ClassTraits: null
    SpellKnowledge: 'A druid''s society will teach him most of the spells that he has sufficient divine skills to cast.\nMore unusual spells can be learned from a teacher, divine writings, personal prayers, etc.'
    Notes: 'Druids revere nature and abhor unnatural creatures. They shun items of a technological or mechanical nature, and they take an oath to not wear metallic armor.\nNearly all druids, even the most solitary and isolated ones, are part of a global society. When the protection of nature requires it, a number of society members may cooperate, but at other times, they may compete with or even prey on each other. The society has a distinct hierarchy, but low-ranking members have few obligations towards their superiors.\nMost druids are elves, gnomes, humans, or half-elves.\nA druid who violates his deity, philosophy, or oaths of conduct will lose the ability to channel natural energy (cast divine spells, change shape, etc.) until he atones. He can still gain levels in the class and improve his druidic skills, but many of them will be mostly useless until atonement.'
    Roles: 'Protector of nature.'
    OldRanks: 'Aspirant, Ovate, Initiate of the 1st Circle - Initiate of the 9th Circle, Druid, Archdruid, The Great Druid'
  -
    ID: 4
    Name: Fighter
    Abbreviation: Ftr
    HPPerLevel: 10
    SPPerLevel: 8
    PPPerLevel: 2
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Str, Con, Dex'
    Alignment: Any
    ClassTraits: null
    SpellKnowledge: null
    Notes: 'Most fighters, as compared to warriors, have had some sort of formal training, usually in an army, an academy, a gladiator school, or at least a militia.\nFighters are common among all of the civilized and semi-civilized races.'
    Roles: 'Mercenary, officer, soldier, guard, bodyguard, martial trainer, champion, hunter.'
    OldRanks: 'Veteran, Warrior, Swordsman, Hero, Swashbuckler, Myrmidon, Champion, Superhero, Lord'
  -
    ID: 5
    Name: Monk
    Abbreviation: Mnk
    HPPerLevel: 7
    SPPerLevel: 7
    PPPerLevel: 6
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Wis, Dex, Str'
    Alignment: Lawful
    ClassTraits: null
    SpellKnowledge: null
    Notes: 'The martial artists known as monks usually gain their upbringing as well as training in rural monasteries or urban schools. In rare cases, a retired and reclusive master will consent to train gifted individuals. Competitions are common between different schools and masters.\nHumans, half-elves, half-orcs, and elves are the only races with a monk tradition.'
    Roles: 'Martial artist, trainer, advisor, special forces soldier, constable, spy.'
    OldRanks: 'Novice, Initiate, Brother, Disciple, Immaculate, Master, Superior Master, Master of Dragons, Master of the North Wind, Master of the West Wind, Master of the South Wind, Master of the East Wind, Master of Winter, Master of Autumn, Master of Summer, Master of Spring, Grand Master of Flowers'
  -
    ID: 6
    Name: Psion
    Abbreviation: Psn
    HPPerLevel: 4
    SPPerLevel: 6
    PPPerLevel: 10
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Wis, Int, Con'
    Alignment: Any
    ClassTraits: null
    SpellKnowledge: 'Psions typically learn new psionic powers from a teacher, a psicrystal, personal meditation, etc.'
    Notes: 'A majority of psions learn and develop their powers on their own. A few, however, grow up in communes or schools that can teach them the use of psionics.\nPsions are rare in many campaigns but can be found among most civilized races.'
    Roles: 'Psion, telepath, seer, scholar, telekineticist, pyrokineticist'
    OldRanks: null
  -
    ID: 7
    Name: Psiwarrior
    Abbreviation: PsW
    HPPerLevel: 8
    SPPerLevel: 6
    PPPerLevel: 6
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Str, Dex, Con'
    Alignment: Chaotic
    ClassTraits: null
    SpellKnowledge: 'Psiwarriors typically learn new psionic powers from a teacher, a psicrystal, personal meditation, etc.'
    Notes: 'Most psiwarriors grow up in communes, families, or schools of psions. Some discover and develop their powers on their own.\nPsiwarriors are rare in many campaigns but can be found among most civilized races.'
    Roles: 'Warrior, scout, spy, bodyguard, teacher.'
    OldRanks: null
  -
    ID: 8
    Name: Ranger
    Abbreviation: Rgr
    HPPerLevel: 8
    SPPerLevel: 8
    PPPerLevel: 4
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Dex, Str, Wis'
    Alignment: Good
    ClassTraits: null
    SpellKnowledge: 'A ranger''s solitary meditation will teach him most of the spells that he has sufficient divine skills to cast.\nMore unusual spells can be learned from a druid teacher, personal prayers, etc.'
    Notes: 'Some rangers receive formal training as military scouts or stealthy skirmishers, while others learn their skills from experienced hunters or retired rangers.\nRangers can be found among most civilized races, but they are most common among elves, half-elves, and humans.'
    Roles: 'Warden, hunter, scout, spy, guerilla soldier.'
    OldRanks: 'Runner, Strider, Scout, Courser, Tracker, Guide, Pathfinder, Ranger, Ranger Knight, Ranger Lord'
  -
    ID: 9
    Name: Rogue
    Abbreviation: Rog
    HPPerLevel: 8
    SPPerLevel: 8
    PPPerLevel: 4
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Dex, Int, Wis'
    Alignment: Non-Lawful
    ClassTraits: null
    SpellKnowledge: null
    Notes: 'The background and training of rogues varies as much as their reasons for adventuring. Some belong to and are trained by a secret (or not so secret) guild, others are self-taught, and a few learn from a more experienced mentor.\nRogues belonging to a guild or a mentor can expect obligations as well as benefits. Freelancers, on the other hand, will have to watch out for not only the law but competitors as well.\nRogues can be found among all the races and in almost any setting. Their roles vary from spies and troubleshooters to burglars, bandits, and thugs.'
    Roles: 'Thief, burglar, smuggler, scout, spy, troubleshooter.'
    OldRanks: 'Rogue (Apprentice), Footpad, Cutpurse, Robber, Burglar, Filcher, Sharper, Magsman, Thief, Master Thief\nBravo (Apprentice), Rutterkin, Waghalter, Murderer, Thug, Killer, Cutthroat, Executioner, Assassin, Expert Assassin, Senior Assassin, Chief Assassin, Prime Assassin, Grandmaster Assassin, Grandfather Assassin'
  -
    ID: 11
    Name: Templar
    Abbreviation: Tmp
    HPPerLevel: 10
    SPPerLevel: 6
    PPPerLevel: 4
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Cha, Str, Wis'
    Alignment: 'Any (same as deity)'
    ClassTraits: null
    SpellKnowledge: 'A templar''s church will teach him most of the spells that he has sufficient divine skills to cast.\nMore unusual spells can be learned from a teacher, divine writings, personal prayers, etc.'
    Notes: 'Templars are devoted to a deity or philosophy, and they follow a strict code of conduct appropriate to this devotion and the deity''s alignment. For example, a lawful good templar should respect life, protect the weak, help those in need, respect legitimate authority, never lie or cheat, and punish the wicked.\nMost templars are trained within the church of their deity or philosophy. Some, however, find their calling outside any official religion and simply follow their own conscience.\nMost templars are humans or half-elves, although a rare few are dwarves or elves.\nA templar who knowingly and willingly commits an act clearly opposite to his alignment loses all divine abilities forever. Those who violate their code of conduct lose all divine abilities until they have atoned.'
    Roles: 'Knight, templar, champion, protector, bodyguard, justiciar.'
    OldRanks: 'Gallant, Keeper, Protector, Defender, Warder, Guardian, Chevalier, Justicer, Paladin'
  -
    ID: 12
    Name: Wizard
    Abbreviation: Wiz
    HPPerLevel: 4
    SPPerLevel: 6
    PPPerLevel: 10
    InflPerLevel: 5
    SkillPtsPerLevel: 18
    KeyAbilities: 'Int/Cha, Dex, Con'
    Alignment: Any
    ClassTraits: null
    SpellKnowledge: 'Wizards typically learn new spells from a teacher, an arcane spellbook, personal development, etc.'
    Notes: 'The training of a wizard involves intensive study and practice, and this training usually takes place in an academy, school, or guild. In rural settings, potential students of the wizardly arts are more often trained by the village wizard or an eccentric hermit.\nMost sorcerers are individualists and develop their skills unaided. Some, however, are fortunate enough to be tutored by a more experienced practitioner. Sorcerers are rarely welcome in schools and guilds meant for wizards.\nWizards are most common among humans, elves, half-elves, and gnomes.'
    Roles: 'War wizard, diviner, troubleshooter, advisor, scholar, teacher, artificer.'
    OldRanks: 'Prestidigitator, Evoker, Conjurer, Theurgist, Thaumaturgist, Magicician, Enchanter, Warlock, Sorcerer, Necromancer, Wizard, Arch-Mage\nPrestidigitator, Minor Trickster, Trickster, Master Trickster, Cabalist, Visionist, Phantasmist, Apparitionist, Spellbinder, Illusionist'
