itemsartifacts:
  -
    ID: 1
    Name: 'Book of Infinite Spells'
    Subtype: 53
    Description: 'This book has d8+22 pages, each of which contains an arcane or divine spell. Determine each spell randomly (50% arcane and 50% divine; max PP cost available when casting a particular spell is 6+2d6 or the minimum for that spell, whichever is higher). The rules for casting the spells and the chance of pages turning are as specified in DMG.'
  -
    ID: 2
    Name: 'Deck of Many Things'
    Subtype: 21
    Description: 'This deck of tarot cards works as described in the DMG.'
  -
    ID: 3
    Name: 'Hammer of Thunderbolts'
    Subtype: 40
    Description: "This is a +3 Warhammer of Returning made for Large-sized wielders and dealing 4d6 HP of base damage. If the wielder wears two different strength-enhancing items and knows the hammer's identity, it can be used to full effect. The enhancement bonus increases to +5, the strength bonuses from both items stack (but only with regards to attack and damage bonuses for attacks made with the hammer), the hammer can be hurled with a range increment of 6 squares (if a hurled attack hits, also make +5 attack against Fort of all creatures within 18 sq; S - stun for 1 round), and it strikes dead any giant it hits (+10 attack against Fort)."
  -
    ID: 4
    Name: "Philosopher's Stone"
    Subtype: 22
    Description: 'This blackish rock works as described in the DMG.'
  -
    ID: 5
    Name: 'Sphere of Annihilation'
    Subtype: 56
    Description: 'This globe of nothingness works as described in the DMG.'
  -
    ID: 6
    Name: 'Staff of the Magi'
    Subtype: 49
    Description: 'This is a magical staff with a 60 PP power pool and the following affinity-activated boostable spells: Detect Magic, Resize Creature, Hold Object, Light, Enchant Armor, Telekinesis, Dispel Magic, Bolt of Fire, Bolt of Ice, Bolt of Lightning, Invisibility, Phase Door, Control Fire, Wall of Energy, Create Web, Summon Outsider, Planar Travel. The staff can be broken for a retributive strike (as described in the DMG). Finally, the staff provides +13 magic resistance, but if the resistance is lowered, the staff can be recharged by absorbing magic like a Rod of Absorption.'
  -
    ID: 7
    Name: 'Talisman of Pure Good'
    Subtype: 38
    Description: 'This talisman works as described in the DMG.'
  -
    ID: 8
    Name: 'Talisman of the Sphere'
    Subtype: 38
    Description: 'This talisman works as described in the DMG.'
  -
    ID: 9
    Name: 'Talisman of Reluctant Wishes'
    Subtype: 38
    Description: 'This talisman works as described in the DMG.'
  -
    ID: 10
    Name: 'Talisman of Ultimate Evil'
    Subtype: 38
    Description: 'This talisman works as described in the DMG.'
  -
    ID: 11
    Name: 'Moaning Diamond, the'
    Subtype: 38
    Description: 'This talisman works as described in the DMG.'
  -
    ID: 12
    Name: 'Orbs of Dragonkind, the'
    Subtype: 38
    Description: 'Each of these ten orbs contains the essence of an ancient dragon (see colors below). The bearer can try to Dominate dragons of its variety (as Dominate Creature but with a 100 sq range and +15 attack against Will). The bearer''s DeC (active and passive) and NDDs are replaced by those of the dragon within the orb (these values cannot be further modified by any means). The Orb provides immunity against the dragon''s type of breath weapon(s), and allows the bearer to use that breath weapon three times per day. Each Orb can detect dragons as described in the DMG. Finally, the Orbs have the following individual spell powers that can be activated at will:\nBlack: Levitate (5 PP)\nBlue: Manipulate Time (5 PP)\nBrass: Teleport (9 PP)\nBronze: Scrying (9 PP)\nCopper: Charm Creature (7 PP)\nGold: Any power of the other Orbs\nGreen: Telekinesis (7 PP)\nRed: Wall of Energy (fire only; 7 PP)\nSilver: Heal Wounds (9 PP)\nWhite: Energy Resistance (cold only; 7 PP)'
  -
    ID: 13
    Name: "Saint's Mace, the"
    Subtype: 40
    Description: 'This cudgel is a +5 Holy, Axiomatic, and Radiant Heavy Mace. It can cast Bolt of Radiance (up to 20 PP) at will.'
  -
    ID: 14
    Name: 'Shadowstaff, the'
    Subtype: 49
    Description: 'This magical staff works as described in the DMG.'
  -
    ID: 15
    Name: 'Shield of the Sun, the'
    Subtype: 9
    Description: 'This +5 Heavy Shield basically works as described in the DMG. The shield provides access to spellcasting as if it is a Templar with 10 levels in Cleric Affinity - Good Domain, Divine - Blessing, Divine - Insight, Divine - Life, Divine - Protection, and Divine - Retribution (and a total of 100 PP).'
  -
    ID: 16
    Name: 'Book of Exalted Deeds'
    Subtype: 53
    Description: 'This holy book works as described in the DMG.'
  -
    ID: 17
    Name: 'Book of Vile Darkness'
    Subtype: 53
    Description: 'This unholy book works as described in the DMG.'
  -
    ID: 18
    Name: 'Sutra of Tranquil Thought'
    Subtype: 53
    Description: 'If a psion studies this book for one week, he gains enough XP to increase one level in the psion class. He also gains a +10 inherent bonus to PP. Otherwise works as described in the ExpPsiHB.'
  -
    ID: 19
    Name: 'Annulus, the'
    Subtype: 38
    Description: 'This artifact projects an antimagic field of +10 in a 20-square-radius that affects everyone except the wielder. It also provides the wielder with +4 resistance to ability damage, has a 50 PP regenerating power pool, and can be used to cast Dimensional Lock and Crystal Shard. The primary power of psionic nullification works as described in ExpPsiHB.'
  -
    ID: 20
    Name: 'Psicrown of the Crystal Mind'
    Subtype: 15
    Description: 'This is a psicrown with a 100 PP regenerating power pool and the following affinity-activated boostable powers: Enhance Mobility, Levitate, Displacement, Bolt of Sound, Control Emotions, Detect Magic, Dominate Creature, Telekinesis, Telepathy, Force Field, Teleport, Toughen Skin, Metabolic Trance. The "retributive strike" works as described in ExpPsiHB.'
  -
    ID: 21
    Name: 'Staff of Ancient Penumbra'
    Subtype: 49
    Description: 'This intelligent and lawful evil artifact is a +5 Fiery Quarterstaff. It allows the wielder to force an attacker to reroll a successful attack roll three times per day, and it grants the wielder darkvision (6 sq) and X-ray vision. Finally, it acts as a psionic focus with a 60 PP regenerating power pool and the following affinity-activated boostable powers: Bolt of Fire, Heal Wounds, Enhance Senses. It otherwise works as described in ExpPsiHB.'
