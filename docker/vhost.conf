<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        CheckSpelling On
        CheckCaseOnly On
    </Directory>

    # Map /legacy URL to the legacy backup directory
    Alias /legacy /var/www/html/legacy
    <Directory /var/www/html/legacy>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        CheckSpelling On
        CheckCaseOnly On
    </Directory>

    # Map /RPGMapperTool URL
    Alias /RPGMapperTool /var/www/html/RPGMapperTool
    Alias /rpgmappertool /var/www/html/RPGMapperTool
    <Directory /var/www/html/RPGMapperTool>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        CheckSpelling On
        CheckCaseOnly On
    </Directory>

    # Map /RPGWorldAtlas URL
    Alias /RPGWorldAtlas /var/www/html/RPGWorldAtlas
    Alias /rpgworldatlas /var/www/html/RPGWorldAtlas
    <Directory /var/www/html/RPGWorldAtlas>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        CheckSpelling On
        CheckCaseOnly On
    </Directory>

    KeepAlive On
    MaxKeepAliveRequests 100
    KeepAliveTimeout 5

    RemoteIPHeader X-Forwarded-For
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set Content-Security-Policy "upgrade-insecure-requests"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
