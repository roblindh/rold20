services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rold20_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    environment:
      APP_NAME: "RoL d20"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME:-rold20}
      DB_USERNAME: ${DB_USER:-rold20_user}
      DB_PASSWORD: ${DB_PASSWORD:-rold20_pass}
      SESSION_DRIVER: cookie
      CACHE_STORE: array
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rold20_net

  db:
    image: mysql:8.0
    container_name: rold20_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-rold20}
      MYSQL_USER: ${DB_USER:-rold20_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rold20_pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rold20_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rold20_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8885}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-rold20_user}
      PMA_PASSWORD: ${DB_PASSWORD:-rold20_pass}
      PMA_DB: ${DB_NAME:-rold20}
    depends_on:
      - db
    networks:
      - rold20_net

volumes:
  db_data:
    driver: local

networks:
  rold20_net:
    driver: bridge
